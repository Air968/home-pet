<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宠伴学园</title>
<style>
/* ============ 基础 ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#3b82f6;--blue-d:#2563eb;--blue-l:#eff6ff;
  --gold:#f59e0b;--gold-l:#fffbeb;--purple:#8b5cf6;--purple-l:#f5f3ff;
  --green:#10b981;--green-l:#ecfdf5;--red:#ef4444;--red-l:#fef2f2;--orange:#f97316;--orange-l:#fff7ed;
  --ink:#1e293b;--sub:#64748b;--line:#e2e8f0;--card:#ffffff;
  --q-n:#94a3b8;--q-r:#3b82f6;--q-e:#a855f7;--q-b:#f59e0b;
  --shadow:0 6px 20px rgba(59,130,246,.08);
}
html,body{min-height:100%}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;color:var(--ink);background:#eef4fb;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit;outline:none}
.hidden{display:none!important}

/* ============ 家长入口 ============ */
.parent-entry{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.6);color:#64748b;font-size:16px;transition:.15s;cursor:pointer;margin-left:4px;vertical-align:middle}
.parent-entry:hover{background:#fff;color:var(--blue);box-shadow:0 2px 10px rgba(59,130,246,.15)}
.p-back{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:8px;background:var(--blue-l);color:var(--blue-d);font-size:13px;font-weight:600;transition:.15s;cursor:pointer;margin-left:auto}
.p-back:hover{background:#dbeafe}

/* ============ 通用组件 ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 22px;border-radius:12px;font-size:15px;font-weight:600;transition:.15s}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(59,130,246,.3)}
.btn.primary:hover{background:var(--blue-d);transform:translateY(-1px)}
.btn.gold{background:var(--gold);color:#fff;box-shadow:0 4px 12px rgba(245,158,11,.35)}
.btn.gold:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn.soft{background:var(--blue-l);color:var(--blue-d)}
.btn.soft:hover{background:#dbeafe}
.btn.ghost{background:#f1f5f9;color:var(--sub)}
.btn.ghost:hover{background:#e2e8f0}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:6px 14px;font-size:13px;border-radius:9px}
.btn.lg{padding:14px 32px;font-size:17px;border-radius:16px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:600}
.bar{height:8px;background:#eef2f7;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#60a5fa,#3b82f6);transition:width .4s}
.bar.g>i{background:linear-gradient(90deg,#34d399,#10b981)}
.bar.o>i{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
.bar.p>i{background:linear-gradient(90deg,#c084fc,#a855f7)}
.q-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;color:#fff}
.q-n{background:var(--q-n)}.q-r{background:var(--q-r)}.q-e{background:var(--q-e)}
.q-b{background:linear-gradient(135deg,#f59e0b,#fbbf24);box-shadow:0 0 8px rgba(245,158,11,.5)}

/* Toast / 弹窗 */
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-16px);z-index:10001;background:rgba(15,23,42,.88);color:#fff;padding:11px 24px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;backdrop-filter:blur(6px);max-width:80vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-mask{position:fixed;inset:0;z-index:300;background:rgba(15,23,42,.4);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
.modal-mask.show{display:flex}
.modal{background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-radius:24px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 64px rgba(15,23,42,.3);animation:pop .22s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:18px 24px 0}
.m-head h3{font-size:18px;font-weight:800}
.m-x{width:32px;height:32px;border-radius:50%;background:#f1f5f9;color:#64748b;font-size:15px;display:flex;align-items:center;justify-content:center}
.m-x:hover{background:#e2e8f0}
.m-body{padding:16px 24px 24px}

/* ============ 孩子端 ============ */
#kidApp{max-width:1080px;margin:0 auto;padding:14px 20px 110px;min-height:100vh;background:linear-gradient(165deg,#f0f7ff 0%,#ffffff 55%,#e3f0fe 100%)}
.k-top{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 16px}
.k-logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;color:#1e3a8a}
.k-logo .lg-ico{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#60a5fa,#3b82f6);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(59,130,246,.35);font-size:20px}
.k-logo .parent-entry{margin-left:2px}
.k-cur{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cur-chip{display:flex;align-items:center;gap:5px;background:#fff;border:1px solid #e3edf8;padding:7px 14px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:0 2px 8px rgba(59,130,246,.06)}
.cur-chip b{font-size:15px}
.cur-lbl{font-size:10px;color:var(--sub);font-weight:500}
.k-nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:6px;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);border:1px solid rgba(226,232,240,.9);border-radius:999px;padding:8px;box-shadow:0 12px 32px rgba(30,58,138,.16)}
.k-nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;width:78px;padding:8px 0;border-radius:999px;color:#64748b;font-size:12px;font-weight:600;transition:.15s;position:relative}
.k-nav-btn:hover{color:var(--blue)}
.k-nav-btn.on{background:linear-gradient(135deg,#60a5fa,#3b82f6);color:#fff;box-shadow:0 6px 14px rgba(59,130,246,.35)}
.k-nav-btn .nv-dot{position:absolute;top:4px;right:16px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.k-h1{font-size:24px;font-weight:800;margin:4px 0 4px;display:flex;align-items:center;gap:10px}
.k-sub{color:var(--sub);font-size:14px;margin-bottom:18px}
.kcard{background:#fff;border-radius:20px;padding:20px;box-shadow:var(--shadow);border:1px solid #eef4fb;transition:.18s}
.kcard:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(59,130,246,.12)}

/* 首页 */
.home-hero{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,#3b82f6 0%,#2563eb 70%,#1d4ed8 100%);border-radius:14px;padding:10px 18px;color:#fff;position:relative;overflow:hidden;box-shadow:0 4px 14px rgba(37,99,235,.2);margin-bottom:14px}
.home-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 90% 50%,rgba(255,255,255,.15) 0%,transparent 60%);pointer-events:none}
.home-hero .hi-emoji{font-size:24px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.2));animation:bob 3s ease-in-out infinite;flex:none}
.home-hero .hero-txt{flex:1;position:relative;z-index:1}
.home-hero .hero-txt h2{font-size:14px;font-weight:800;line-height:1.2}
.home-hero .hero-txt p{font-size:11px;opacity:.85;line-height:1.3;margin-top:1px}
.home-hero .hero-stats{display:flex;gap:16px;position:relative;z-index:1;flex:none}
.home-hero .hero-stat{display:flex;align-items:center;gap:6px}
.home-hero .hero-stat .hs-ico{font-size:16px}
.home-hero .hero-stat .hs-num{font-size:15px;font-weight:800;line-height:1}
.home-hero .hero-stat .hs-lbl{font-size:10px;opacity:.7;line-height:1;margin-top:1px}
/* 首页紧凑宠物卡片 */
.home-pet-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.home-pet-card{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:#fff;border:2px solid #ffffff;box-shadow:0 4px 14px rgba(59,130,246,.06);cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.home-pet-card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(59,130,246,.12)}
.home-pet-card .hpc-img{flex:none;width:70px;height:70px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:linear-gradient(135deg,#f0f7ff,#e6f0ff)}
.home-pet-card .hpc-body{flex:1;min-width:0}
.home-pet-card .hpc-name{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px;margin-bottom:2px}
.home-pet-card .hpc-stage{font-size:11px;color:var(--sub);margin-bottom:6px}
.home-pet-card .hpc-bar{height:6px;border-radius:999px;background:#f1f5f9;overflow:hidden;margin-bottom:3px}
.home-pet-card .hpc-bar i{display:block;height:100%;border-radius:999px;transition:width .3s}
.home-pet-card .hpc-stats{display:flex;gap:12px;font-size:11px;color:var(--sub)}
.home-pet-card.qc-r{border-color:var(--blue)}
.home-pet-card.qc-e{border-color:var(--purple)}
.home-pet-card.qc-b{border-color:var(--gold);box-shadow:0 0 16px rgba(245,158,11,.15)}
.home-pet-card .hpc-badge{position:absolute;top:10px;right:12px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px}
.home-empty{text-align:center;padding:40px 20px;border-radius:16px;border:2px dashed #cbd5e1;background:#f8fafc}
.home-empty p{font-size:13px;color:var(--sub);margin-top:8px}
/* 宠物小屋卡片 */
.pet-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.pet-card{display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;overflow:hidden;padding:14px 14px 12px;border-radius:20px;cursor:pointer;background:#fff;border:2px solid #ffffff;box-shadow:0 4px 14px rgba(59,130,246,.06);transition:.18s}
.pet-card:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 10px 28px rgba(59,130,246,.14)}
.pet-card .stage-tag{position:absolute;top:10px;left:10px;font-size:10px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--blue-l);color:var(--blue-d);z-index:2}
.pet-card .pet-stage{height:170px;width:100%;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;margin:8px 0 6px}
.pet-card .p-name{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px;position:relative;z-index:1;margin-bottom:2px}
.pet-card .q-badge{position:absolute;top:10px;right:10px;z-index:2}
.pet-card .pet-mood{font-size:11px;color:var(--sub);margin-bottom:4px}
.pet-card .pet-bars{width:100%;display:flex;flex-direction:column;gap:4px}
.pet-card::before{content:'';position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(180deg,transparent,rgba(147,197,253,.12));pointer-events:none}
.pet-card.qc-r{border:2px solid var(--blue);box-shadow:0 8px 24px rgba(59,130,246,.18)}
.pet-card.qc-e{border:2px solid var(--purple);box-shadow:0 8px 24px rgba(168,85,247,.2)}
.pet-card.qc-b{border:2px solid var(--gold);box-shadow:0 0 22px rgba(245,158,11,.25),0 10px 28px rgba(245,158,11,.15)}
.pet-card .pb-row{font-size:10px;display:flex;align-items:center;gap:4px}
.pet-card .pb-row .bar{height:6px;flex:1;min-width:0}
.pet-act{display:flex;gap:8px;margin-top:6px;position:relative;z-index:1}

/* 宠物页子标签 */
.sub-tabs{display:flex;gap:10px;margin:2px 0 20px;flex-wrap:wrap}
.sub-tab{display:flex;align-items:center;gap:7px;padding:10px 22px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:14.5px;font-weight:700;color:var(--sub);transition:.15s;box-shadow:0 2px 10px rgba(59,130,246,.05)}
.sub-tab:hover{border-color:#bfdbfe;color:var(--blue-d)}
.sub-tab.on{background:linear-gradient(135deg,#60a5fa,#3b82f6);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(59,130,246,.35)}
.sub-tab .st-badge{font-size:11px;background:rgba(255,255,255,.35);padding:1px 8px;border-radius:999px}
.sub-tab:not(.on) .st-badge{background:var(--blue-l);color:var(--blue-d)}
.pet-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}

/* 领养区 */
.adopt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.adopt-card{display:flex;flex-direction:column;align-items:center;padding:16px 12px 14px;background:#fff;border-radius:18px;border:2px solid #ffffff;transition:.18s;text-align:center;cursor:pointer;position:relative;overflow:hidden}
.adopt-card:not(.locked):hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(59,130,246,.16)}
.adopt-card.locked{opacity:.55;cursor:not-allowed}
.adopt-card .ad-look{height:120px;width:100%;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.adopt-card .ad-name{font-size:15px;font-weight:800}
.adopt-card .q-badge{font-size:10px;padding:1px 8px;margin-top:4px}
.adopt-btn{margin-top:10px;padding:8px 22px;border:none;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;font-size:15px;font-weight:700;letter-spacing:1px;cursor:pointer;box-shadow:0 4px 12px rgba(37,99,235,.25);transition:.15s}
.adopt-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(37,99,235,.35)}
.adopt-lock-txt{margin-top:10px;font-size:11px;color:var(--sub);font-weight:600}
.adopt-card.qc-r{border-color:var(--blue)}
.adopt-card.qc-e{border-color:var(--purple)}
.adopt-card.qc-b{border-color:var(--gold)}

/* 神兽领养 */
.beast-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.beast-card{display:flex;flex-direction:column;align-items:center;padding:16px 16px 14px;background:#fff;border-radius:20px;border:2px solid var(--gold);position:relative;overflow:hidden;transition:.18s;text-align:center;cursor:default}
.beast-card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(245,158,11,.12)}
.beast-card .bs-ico{width:110px;height:110px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:50%;background:linear-gradient(160deg,#fffbeb,#fef3c7);margin-bottom:8px}
.beast-card.bs-ready{background:linear-gradient(135deg,#fffbeb,#fff7ed);border:2px solid var(--gold);box-shadow:0 0 22px rgba(245,158,11,.2)}
.beast-card.bs-owned{background:linear-gradient(135deg,#f0fdf4,#ecfdf5);border-color:var(--gold)}
.beast-card .bs-info{width:100%;text-align:center}
.beast-card .bs-info h5{font-size:16px;font-weight:800;display:flex;gap:8px;align-items:center;margin-bottom:5px}
.beast-card .bs-info p{font-size:12px;color:var(--sub);margin-bottom:8px}
.beast-claim{position:absolute;right:14px;bottom:14px}

/* 任务页 */
.task-list{display:flex;flex-direction:column;gap:12px}
.task-card{display:flex;align-items:center;gap:16px;padding:16px 20px;background:#fff;border-radius:18px;border:1px solid #eef4fb;box-shadow:0 3px 10px rgba(59,130,246,.05);transition:.15s;cursor:pointer}
.task-card:hover{transform:translateX(4px);box-shadow:0 8px 22px rgba(59,130,246,.12)}
.task-card.done{opacity:.75;cursor:default}
.task-card.done:hover{transform:none}
.t-ico{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:21px;flex-shrink:0}
.t-mid{flex:1}
.t-mid h4{font-size:15.5px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.t-mid p{font-size:12.5px;color:var(--sub)}
.t-status{font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px;flex-shrink:0}
.ts-todo{background:var(--blue-l);color:var(--blue-d)}
.ts-done{background:var(--green-l);color:#059669}
.ts-wait{background:var(--gold-l);color:#b45309}
.ts-run{background:var(--purple-l);color:#7c3aed}
.task-progress-card{display:flex;align-items:center;gap:20px;margin-bottom:16px}
.ring-wrap{position:relative;width:92px;height:92px;flex-shrink:0}
.ring-wrap .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--sub)}
.ring-wrap .rt b{font-size:19px;color:var(--blue-d)}

/* 任务运行弹窗内 */
.run-word{font-size:15px}
.listen-btn{display:flex;align-items:center;gap:10px;background:var(--blue-l);color:var(--blue-d);border-radius:14px;padding:14px 20px;font-size:15px;font-weight:700;width:100%;justify-content:center;transition:.15s}
.listen-btn:hover{background:#dbeafe}
.word-input{width:100%;padding:14px 18px;border:2px solid var(--line);border-radius:14px;font-size:20px;text-align:center;letter-spacing:2px;transition:.15s}
.word-input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(59,130,246,.12)}
.word-input.ok{border-color:var(--green);background:var(--green-l)}
.word-input.bad{border-color:var(--red);background:var(--red-l);animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hw{height:64px;border:2px dashed #dbe7f6;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:13px;background:#f8fbff}
.hw-box{font-size:14.5px;line-height:2;color:#334155}
.rec-btn{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:16px;border-radius:16px;background:var(--red-l);color:var(--red);font-weight:700;transition:.15s}
.rec-btn:hover{background:#fee2e2}
.rec-btn.recording{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 12px rgba(239,68,68,0)}}
.wave{display:flex;gap:3px;align-items:center;height:24px}
.wave i{width:3px;background:currentColor;border-radius:2px;animation:wv 1s ease-in-out infinite}
@keyframes wv{0%,100%{height:5px}50%{height:22px}}
.ai-thinking{display:flex;align-items:center;gap:8px;color:#7c3aed;font-size:13.5px;font-weight:600;padding:12px;background:var(--purple-l);border-radius:12px}
.ai-thinking .dots i{width:5px;height:5px;border-radius:50%;background:#7c3aed;display:inline-block;margin:0 2px;animation:dt 1.2s infinite}
.ai-thinking .dots i:nth-child(2){animation-delay:.2s}.ai-thinking .dots i:nth-child(3){animation-delay:.4s}
@keyframes dt{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt-btn{padding:14px;border:2px solid var(--line);border-radius:14px;font-size:15px;font-weight:600;text-align:left;transition:.15s;background:#fff}
.opt-btn:hover{border-color:var(--blue);color:var(--blue-d)}
.opt-btn.ok{border-color:var(--green);background:var(--green-l);color:#059669}
.opt-btn.bad{border-color:var(--red);background:var(--red-l);color:#b91c1c}
.calc-q{font-size:26px;font-weight:800;text-align:center;padding:18px;letter-spacing:2px;background:#f8fbff;border-radius:14px;border:1px solid #e3edf8}
.reward-pop{display:flex;align-items:center;justify-content:center;gap:18px;padding:20px 0}
.reward-pop .rp{display:flex;flex-direction:column;align-items:center;gap:4px;animation:rw .5s ease}
@keyframes rw{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.reward-pop .rp .n{font-size:22px;font-weight:800}
.reward-pop .rp .l{font-size:11px;color:var(--sub)}

/* 宠物页 · 喂食选项（弹窗内） */
.feed-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.feed-opt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:1px solid var(--line);border-radius:10px;transition:.15s;background:#fff}
.feed-opt:hover:not(:disabled){border-color:var(--gold);background:var(--gold-l)}
.feed-opt:disabled{opacity:.4;cursor:not-allowed}
.feed-opt .f-ico{font-size:20px}

async function apiPost(path,body){

  let j={};try{j=await r.json()}catch(e){}

}

let CLOUD_ADMINS=[];

function pushGlobal(){
  if(!isAdmin())return;
  clearTimeout(_gTimer);
  _gTimer=setTimeout(async()=>{

async function pullAll(u,token){
  let g=null;try{g=await apiGet('/api/global')}catch(e){}
  const {ok,j}=await apiPost('/api/data/get',{u,token});
  if(!ok){if(j&&j.error==='bad_token')throw new Error('AUTH');throw new Error('NET')}
  const data=j.data;
  let local=null;try{local=JSON.parse(localStorage.getItem('cbxy_data_'+u))}catch(e){}
  if(data&&local&&local._savedAt&&(!data._savedAt||local._savedAt>data._savedAt)){
    S=local;migrateData();applyGlobal(g);
    await apiPost('/api/data/save',{u,token,data:blobFromS()});
  }else if(data){
    S=data;S.assets={};S.customSpecies=[];S.customNames={};migrateData();applyGlobal(g);
  }else if(local&&local._savedAt===undefined&&local.profiles&&local.profiles.length){
    S=local;migrateData();applyGlobal(g);
    await apiPost('/api/data/save',{u,token,data:blobFromS()});
  }else{
    S=defaultState();applyGlobal(g);
  }
  localStorage.setItem(KEY,JSON.stringify(S));
}
async function doLogin(){
  hideLoginError();
  const u=($('#loginUser')||{}).value?.trim()||'';
  const p=($('#loginPwd')||{}).value||'';
  if(!u&&!p){showLoginError('请输入用户名和密码');return}
  if(!u){showLoginError('请输入用户名');return}
  if(!p){showLoginError('请输入密码');return}
  const btn=document.querySelector('[onclick="doLogin()"]');
  if(btn){btn.disabled=true;btn.textContent='登录中…'}
  try{
    const {ok,j}=await apiPost('/api/auth/login',{u,p});
    if(ok&&j.token){await loginSuccess(u,j.token);return}
    if(j.error==='no_user'){
      if(localAccountCheck(u,p)){await migrateLocalToServer(u,p);return}
      showLoginError('用户名「'+u+'」不存在，请检查或注册新账号');return;
    }
    if(j.error==='bad_pwd'){showLoginError('密码错误，请重新输入');const pi=$('#loginPwd');if(pi){pi.value='';pi.focus()};return}
    if(localAccountCheck(u,p)){await loginSuccess(u,'',true);toast('⚠️ 云端暂不可达，已用本地数据登录');return}
    showLoginError('无法连接服务器，请检查网络后重试');
  }catch(e){
    if(localAccountCheck(u,p)){await loginSuccess(u,'',true);toast('⚠️ 云端暂不可达，已用本地数据登录');return}
    showLoginError('无法连接服务器，请检查网络后重试');
  }finally{
    if(btn){btn.disabled=false;btn.textContent='登 录'}
  }
}
async function migrateLocalToServer(u,p){
  const reg=await apiPost('/api/auth/register',{u,p});
  if(!reg.ok||!reg.j.token){showLoginError(reg.j.error==='exists'?'该用户名已在云端存在，密码不匹配':'迁移失败：'+(reg.j.error||'服务异常'));return}
  loadUserData(u);
  try{
    await apiPost('/api/data/save',{u,token:reg.j.token,data:blobFromS()});
    let sg=null;try{sg=await apiGet('/api/global')}catch(e){}
    const g=sg||{};
    if(Array.isArray(g.admins))CLOUD_ADMINS=g.admins;
    S.assets=Object.assign({},g.assets||{},S.assets||{});
    const ids=new Set((S.customSpecies||[]).map(c=>c.id));
    S.customSpecies=(g.customSpecies||[]).filter(c=>!ids.has(c.id)).concat(S.customSpecies||[]);
    S.customNames=Object.assign({},g.customNames||{},S.customNames||{});
    if(isAdmin()){try{await apiPost('/api/global/save',{u,token:reg.j.token,assets:S.assets,customSpecies:S.customSpecies,customNames:S.customNames})}catch(e){}}
  }catch(e){}
  toast('✅ 账号已同步到云端！以后任何设备登录都用同一份数据');
  await loginSuccess(u,reg.j.token);
}

  localStorage.setItem(SESSION_KEY,u);
  if(token)localStorage.setItem(TOKEN_KEY,token);

  if(offline){
    loadUserData(u);

    try{
      await pullAll(u,token);

      if(String(e.message)==='AUTH'){

function addItem(key,n=1){if(!S.inventory)S.inventory={normal:0,tasty:0,feast:0,rare:0};S.inventory[key]=Math.min(FOOD_MAX,(S.inventory[key]||0)+n)}
function useItem(key,n=1){if(!S.inventory||!S.inventory[key]||S.inventory[key]<n)return false;S.inventory[key]-=n;return true}
/* 饱食度真实时间流失：4点/小时，心情联动 */
function decayStats(){
  const now=Date.now();
  const p=curProfile();if(!p)return;
  const last=p.kid.lastDecay||now;
  const hours=(now-last)/3600000;
  if(hours<0.05)return;
  p.kid.lastDecay=now;
  S.pets.forEach(pet=>{
    if(pet.egg)return;
    const loss=Math.round(hours*4);
    const before=pet.sat;
    pet.sat=Math.max(0,pet.sat-loss);
    const satNow=pet.sat;
    let moodLoss=0;
    if(satNow<=20){moodLoss=hours*2}
    else if(satNow<=50){moodLoss=hours*1}
    else if(satNow<=70){moodLoss=hours*0.5}
    if(moodLoss>0)pet.mood=Math.max(0,Math.round((pet.mood-moodLoss)*10)/10);
  });
  save();
}

  '2-2':[
    {title:'咏柳',passage:'碧玉妆成一树高，万条垂下绿丝绦。不知细叶谁裁出，二月春风似剪刀。这是贺知章写的诗，把春风比作剪刀，裁出了细细的柳叶。',qs:[{q:'《咏柳》的作者是谁？',o:['贺知章','李白','杜甫','王安石'],a:0,e:'贺知章。'},{q:'诗中把春风比作什么？',o:['剪刀','画笔','绸带','清风'],a:0,e:'二月春风似剪刀。'}]},
    {title:'蜜蜂引路',passage:'列宁想找养蜂的人谈天，可是不知道他住在哪里。列宁在路边看见花丛里有许多蜜蜂，就跟着蜜蜂走。蜜蜂飞进一个小园子，列宁敲开门，果然找到了养蜂人。',qs:[{q:'列宁是靠什么找到养蜂人的？',o:['跟着蜜蜂走','问路','看地图','打电话'],a:0,e:'跟着蜜蜂找到了养蜂人。'},{q:'蜜蜂飞进了哪里？',o:['小园子','大树','房子','山洞'],a:0,e:'蜜蜂飞进一个小园子。'}]},
    {title:'雷雨',passage:'满天的乌云，黑沉沉地压下来。忽然一阵大风，吹得树枝乱摆。闪电越来越亮，雷声越来越响。哗，哗，哗，雨下起来了。渐渐地，雷声小了，雨声也小了，天亮起来了。',qs:[{q:'雷雨前天空是什么样？',o:['乌云黑沉沉','蓝天白云','彩霞满天','星星很多'],a:0,e:'乌云黑沉沉地压下来。'},{q:'雷雨时风把什么吹得乱摆？',o:['树枝','房子','大山','河流'],a:0,e:'吹得树枝乱摆。'}]},
  ],
  '3-1':[
    {title:'刻舟求剑',passage:'从前有个人坐船过河，一不小心把宝剑掉进了水里。他在船边刻了一个记号，说："我的剑就是从这个地方掉下去的。"等船到了对岸，他从刻记号的地方下水找剑，当然找不到了。船已经走了，但剑掉下去的地方是不动的。',qs:[{q:'这个人为什么找不到剑？',o:['船走了但剑没动','剑被鱼吃了','水太深','剑不存在'],a:0,e:'船在动，但剑掉落的位置不变。'},{q:'这个成语告诉我们什么？',o:['事物在变化，不能用老办法','不要坐船','不要带剑','河水很危险'],a:0,e:'事物在变化，方法也要跟着变。'}]},
    {title:'秋天的雨',passage:'秋天的雨，是一把钥匙。它带着清凉和温柔，轻轻地打开了秋天的大门。秋天的雨，有一盒五彩缤纷的颜料。它把黄色给了银杏，把红色给了枫叶，把金色给了田野。',qs:[{q:'秋天的雨像什么？',o:['一把钥匙','一把扇子','一根针','一条河'],a:0,e:'秋天的雨是一把钥匙。'},{q:'红色给了谁？',o:['枫叶','银杏','田野','松树'],a:0,e:'把红色给了枫叶。'}]},
    {title:'富饶的西沙群岛',passage:'西沙群岛一带，海水五光十色，瑰丽无比。鱼成群结队地在珊瑚丛中游来游去。海滩上有捡不完的贝壳，海岛上栖息着无数海鸟，是鸟的天下。',qs:[{q:'西沙群岛的海水怎么样？',o:['五光十色','浑浊不清','又黑又脏','一片雪白'],a:0,e:'海水五光十色，瑰丽无比。'},{q:'海岛是什么的天下？',o:['鸟','鱼','贝壳','螃蟹'],a:0,e:'海岛是鸟的天下。'}]},
  ],
  '3-2':[
    {title:'赵州桥',passage:'河北省赵县的洨河上，有一座世界闻名的石拱桥，叫赵州桥。它已经有一千四百多年的历史了。这座桥不但坚固，而且美观，体现了劳动人民的智慧和才干。',qs:[{q:'赵州桥是什么桥？',o:['石拱桥','木桥','铁桥','吊桥'],a:0,e:'赵州桥是石拱桥。'},{q:'赵州桥体现了什么？',o:['劳动人民的智慧','皇帝的功劳','神仙的法术','外国的技术'],a:0,e:'体现劳动人民的智慧和才干。'}]},
    {title:'翠鸟',passage:'翠鸟喜欢停在水边的苇秆上。它颜色鲜艳，头上的羽毛像橄榄色的头巾，背上的羽毛像浅绿色的外衣。翠鸟一动不动地注视着水面，等待游到水面上来的小鱼。',qs:[{q:'翠鸟喜欢停在哪里？',o:['水边苇秆上','屋顶上','大树上','山洞里'],a:0,e:'水边的苇秆上。'},{q:'翠鸟在等待什么？',o:['小鱼','小虫','朋友','雨水'],a:0,e:'等待游上来的小鱼。'}]},
    {title:'绝招',passage:'小柱子和小伙伴比绝招。别人都有拿手本领，小柱子却什么都不会，很不好意思。回家后他刻苦练习口算，第二次比赛时，他一口气报出了十几道题的答案，赢得了大家的称赞。',qs:[{q:'小柱子回家后做了什么？',o:['刻苦练习口算','看电视','睡大觉','玩游戏'],a:0,e:'刻苦练习口算。'},{q:'这个故事告诉我们什么？',o:['勤学苦练才能有绝招','比赛不重要','不会就没面子','要靠小聪明'],a:0,e:'勤学苦练才有真本领。'}]},
  ],
  '4-1':[
    {title:'小马过河',passage:'小马驮着半口袋麦子，要过一条小河。老牛说："水很浅，刚没过小腿。"松鼠却大叫："水很深，昨天我的伙伴就淹死在这条河里！"小马没了主意，跑回家问妈妈。妈妈说："孩子，光听别人说是不行的，你自己去试试就知道了。"小马小心地蹚过河，原来河水既不像老牛说的那样浅，也不像松鼠说的那样深。',qs:[{q:'老牛说河水怎么样？',o:['很浅','很深','没有水','结冰了'],a:0,e:'老牛说水很浅，刚没过小腿。'},{q:'《小马过河》告诉我们什么道理？',o:['要自己动手试试才知道','别人的话都不能听','河水很危险','松鼠很胆小'],a:1,e:'光听别人说不行，自己试试才知道。'}]},
    {title:'观潮',passage:'午后一点左右，从远处传来隆隆的响声，好像闷雷滚动。过了一会儿，响声越来越大，只见东边水天相接的地方出现了一条白线。白线很快向我们移来，逐渐拉长、变粗，横贯江面。浪潮越来越近，犹如千万匹白色战马齐头并进，浩浩荡荡地飞奔而来。',qs:[{q:'潮来时先听到了什么？',o:['隆隆的响声','唱歌声','喇叭声','风声'],a:0,e:'传来隆隆的响声，好像闷雷滚动。'},{q:'浪潮像什么？',o:['白色战马','白色巨龙','白色大山','白色云朵'],a:0,e:'犹如千万匹白色战马齐头并进。'}]},
    {title:'爬山虎的脚',passage:'爬山虎的脚长在茎上，茎上长叶柄的地方，反面伸出枝状的六七根细丝。细丝跟新叶子一样，也是嫩红的。爬山虎的脚触着墙的时候，六七根细丝的头上就变成小圆片，巴住墙。要是你的手指不费一点儿劲，休想拉下爬山虎的一根茎。',qs:[{q:'爬山虎的脚长在哪里？',o:['茎上','叶子上','根上','花上'],a:0,e:'脚长在茎上。'},{q:'爬山虎的脚触着墙会变成什么？',o:['小圆片','小钩子','小吸盘','小刺'],a:0,e:'细丝头上变成小圆片，巴住墙。'}]},
  ],
  '4-2':[
    {title:'乡下人家',passage:'乡下人家总爱在屋前搭一瓜架，种上南瓜或丝瓜。青、红的瓜，碧绿的藤和叶，构成了一道别有风趣的装饰。有些人家，还在门前的场地上种几株花，芍药、凤仙、鸡冠花、大丽菊，它们依着时令，顺序开放。',qs:[{q:'乡下人家爱在屋前搭什么？',o:['瓜架','秋千','篱笆','石桌'],a:0,e:'屋前搭一瓜架。'},{q:'文中写了哪些花？',o:['芍药凤仙鸡冠花大丽菊','玫瑰牡丹百合','梅花兰花竹子','荷花桂花菊花'],a:0,e:'芍药、凤仙、鸡冠花、大丽菊依着时令开放。'}]},
    {title:'记金华的双龙洞',passage:'出金华城大约五公里到罗店，过了罗店就渐渐入山。公路盘曲而上。山上开满了映山红，无论花朵和叶子，都比盆栽的杜鹃显得有精神。粉红色的山，各色的映山红，再加上或浓或淡的新绿，眼前一片明艳。',qs:[{q:'双龙洞在哪个城市附近？',o:['金华','杭州','苏州','南京'],a:0,e:'金华城大约五公里。'},{q:'山上开满了什么花？',o:['映山红','玫瑰','菊花','梅花'],a:0,e:'山上开满了映山红。'}]},
    {title:'文言文二则·囊萤夜读',passage:'胤恭勤不倦，博学多通。家贫不常得油，夏月则练囊盛数十萤火以照书，以夜继日焉。意思是：车胤谦恭勤奋，学习从不懈怠。家里穷没有灯油，夏天他就用白绢袋装几十只萤火虫照着书本，夜以继日地学习。',qs:[{q:'车胤用什么照着书本读书？',o:['萤火虫','蜡烛','月亮','火把'],a:0,e:'练囊盛数十萤火以照书。'},{q:'车胤是个怎样的人？',o:['勤奋好学','懒惰贪玩','骄傲自大','胆小怕事'],a:0,e:'恭勤不倦，夜以继日地学习。'}]},
  ],
  '5-1':[
    {title:'白鹭',passage:'白鹭是一首精巧的诗。色素的配合，身段的大小，一切都很适宜。那雪白的蓑毛，那全身的流线型结构，那铁色的长喙，那青色的脚，增之一分则嫌长，减之一分则嫌短，素之一忽则嫌白，黛之一忽则嫌黑。',qs:[{q:'作者把白鹭比作什么？',o:['一首精巧的诗','一幅画','一支歌','一朵云'],a:0,e:'白鹭是一首精巧的诗。'},{q:'白鹭的喙是什么颜色？',o:['铁色','红色','黄色','白色'],a:0,e:'那铁色的长喙。'}]},
    {title:'落花生',passage:'父亲说："花生的好处很多，有一样最可贵：它的果实埋在地里，不像桃子、石榴、苹果那样，把鲜红嫩绿的果实高高地挂在枝头上。你们看它矮矮地长在地上，等到成熟了，也不能立刻分辨出来它有没有果实，必须挖起来才知道。"',qs:[{q:'花生的果实长在哪里？',o:['地里','枝头上','树顶','水中'],a:0,e:'花生的果实埋在地里。'},{q:'父亲借花生告诉孩子什么道理？',o:['做人要朴实有用','要长得漂亮','要高高在上','要吃花生'],a:0,e:'要做朴实无华但有用的人。'}]},
    {title:'忆读书',passage:'冰心奶奶说："我永远感到读书是我生命中最大的快乐！"从读书中她还得到了做人处世的"独立思考"的大道理。读书好，多读书，读好书，这是她对孩子们的期望。',qs:[{q:'冰心奶奶认为读书是什么？',o:['生命中最大的快乐','最痛苦的事','浪费时间','不得不做的事'],a:0,e:'读书是生命中最大的快乐。'},{q:'冰心奶奶对读书的九字期望是？',o:['读书好多读书读好书','好好学天天向上','读古书写作文','多做题多考试'],a:0,e:'读书好，多读书，读好书。'}]},
  ],
  '5-2':[
    {title:'草船借箭',passage:'周瑜看到诸葛亮挺有才干，心里很妒忌。他要求诸葛亮十天造十万支箭，诸葛亮说只要三天。诸葛亮请鲁肃借了二十条船，每条船上配三十名军士。第三天四更时候，大雾漫天，船队靠近曹军水寨，一字摆开，擂鼓呐喊。曹操不敢轻易出动，只叫弓弩手朝江中放箭。天亮时，船两边的草把子上插满了箭，足有十万多支。',qs:[{q:'诸葛亮借箭用了什么天气？',o:['大雾天','大雨天','大晴天','大风天'],a:0,e:'第三天四更大雾漫天。'},{q:'箭实际上是谁"送"的？',o:['曹操的军队','周瑜的军队','孙权的军队','老百姓'],a:0,e:'曹操叫弓弩手朝江中放箭。'}]},
    {title:'景阳冈',passage:'武松在景阳冈下的酒店里，前后共喝了十八碗酒。他不听店家劝告，提了哨棒独自上冈。傍晚时分，一只吊睛白额大老虎朝武松扑来。武松一闪，躲过虎的一扑、一掀、一剪，趁老虎劲儿泄了一半，抡起哨棒使尽平生力气打死了老虎。',qs:[{q:'武松在酒店喝了多少碗酒？',o:['十八碗','三碗','五碗','三十碗'],a:0,e:'前后共喝了十八碗酒。'},{q:'武松用什么打死了老虎？',o:['哨棒','大刀','弓箭','石头'],a:0,e:'抡起哨棒打死了老虎。'}]},
    {title:'猴王出世',passage:'海外有一国土，名曰傲来国。国近大海，海中有一座名山，唤为花果山。那座山正当顶上，有一块仙石。一日迸裂，产一石卵，见风化作一个石猴。石猴在山中行走跳跃，昼夜不歇，非常快乐。后来他因敢于第一个跳进水帘洞，被众猴拜为猴王。',qs:[{q:'石猴是从什么变来的？',o:['仙石迸裂的石头','树上结的果','海里的鱼','山上的土'],a:0,e:'仙石迸裂产一石卵，见风化作石猴。'},{q:'石猴为什么被拜为猴王？',o:['第一个跳进水帘洞','长得最漂亮','力气最大','年龄最大'],a:0,e:'敢第一个跳进水帘洞。'}]},
  ],
  '6-1':[
    {title:'草原',passage:'这次，我看到了草原。那里的天比别处的更可爱，空气是那么清鲜，天空是那么明朗。在天底下，一碧千里，而并不茫茫。四面都有小丘，平地是绿的，小丘也是绿的。羊群一会儿上了小丘，一会儿又下来，走在哪里都像给无边的绿毯绣上了白色的大花。',qs:[{q:'文中把羊群比作什么？',o:['白色的大花','白色的云','白色的雪','白色的棉絮'],a:0,e:'像给绿毯绣上了白色的大花。'},{q:'草原的天有什么特点？',o:['明朗清鲜','阴沉灰暗','狂风大作','电闪雷鸣'],a:0,e:'空气清鲜，天空明朗。'}]},
    {title:'丁香结',passage:'古人词云："芭蕉不展丁香结""丁香空结雨中愁"。每个人一辈子都有许多不顺心的事，一件完了一件又来。所以丁香结年年都有。结，是解不完的；人生中的问题也是解不完的，不然，岂不太平淡无味了吗？',qs:[{q:'"丁香结"比喻什么？',o:['人生中解不完的愁结','丁香花的形状','下雨的天气','春天的景色'],a:0,e:'比喻人生中不顺心的事。'},{q:'作者认为人生有问题才怎样？',o:['不平淡无味','非常痛苦','毫无意义','应该逃避'],a:0,e:'不然岂不太平淡无味了。'}]},
    {title:'西江月·夜行黄沙道中',passage:'明月别枝惊鹊，清风半夜鸣蝉。稻花香里说丰年，听取蛙声一片。七八个星天外，两三点雨山前。旧时茅店社林边，路转溪桥忽见。辛弃疾的这首词写出了夏夜乡村的优美景色和丰收在望的喜悦。',qs:[{q:'这首词的作者是谁？',o:['辛弃疾','苏轼','李清照','欧阳修'],a:0,e:'辛弃疾。'},{q:'词中"说丰年"的是稻花和什么？',o:['蛙声','蝉鸣','鸟叫','风声'],a:0,e:'稻花香里说丰年，听取蛙声一片。'}]},
  ],
  '6-2':[
    {title:'匆匆',passage:'燕子去了，有再来的时候；杨柳枯了，有再青的时候；桃花谢了，有再开的时候。但是，聪明的，你告诉我，我们的日子为什么一去不复返呢？洗手的时候，日子从水盆里过去；吃饭的时候，日子从饭碗里过去。',qs:[{q:'《匆匆》的作者是谁？',o:['朱自清','老舍','巴金','鲁迅'],a:0,e:'朱自清。'},{q:'文中说日子从哪里过去？',o:['水盆和饭碗','书本和铅笔','太阳和月亮','操场和教室'],a:0,e:'从水盆里、饭碗里过去。'}]},
    {title:'那个星期天',passage:'那个星期天，从早晨到下午，我一直等着母亲带出去。我蹲在她身边看着她洗衣裳，看着盆里的衣服和绽开的泡沫。光线正在无可挽回地消逝，一派荒凉。母亲发现我是那么乖地一直在她身边，一把拉起我。光线越来越暗，越来越消逝，越来越荒凉。',qs:[{q:'"我"在那个星期天一直在做什么？',o:['等母亲带出去','写作业','看电视','睡觉'],a:0,e:'从早晨到下午一直在等。'},{q:'文中的光线变化暗示了什么？',o:['希望慢慢落空','天气要下雨','早晨来了','母亲回来了'],a:0,e:'光线消逝暗示等待落空。'}]},

function enStep(){
  const w=enQueue[0];

    <button class="listen-btn" onclick="speak('${w[0]}')">🔊 听发音（再点一次重听）</button>

}
let enLock=false;
function enSubmit(){
  if(enLock)return;

      $('#enFeed').innerHTML=`<div class="reward-pop"><div class="rp"><span class="n">⭐+10</span><span class="l">经验</span></div><div class="rp"><span class="n">🪙+5</span><span class="l">金币</span></div><div class="rp"><span class="n">🍖 ${Math.random()<.3?'掉落 1':''}</span><span class="l">食物</span></div></div>`;

    },420);

      }
      $('#enFeed').innerHTML=`<div class="ai-thinking" style="background:var(--red-l);color:#b91c1c">✗ 拼错了${useAI?' · AI 老师讲解':''}<div style="flex:1"></div><b style="color:var(--ink)">${w[0]}</b></div><p style="font-size:12.5px;color:var(--sub);margin-top:8px">${aiTip}</p>

    },380);
  }

    <div class="hw-box" style="background:#fffbeb;border:2px dashed #fde68a;border-radius:14px;padding:16px 20px;font-size:14.5px;line-height:2.1;margin-bottom:16px">${ct.passage}</div>
    <div style="display:flex;gap:12px;align-items:center">
      <button class="rec-btn" id="recBtn" onclick="zhToggleRec()" style="flex:1"><span style="font-size:24px">🎤</span><span id="recTxt">${SR?'点击开始朗读（AI 实时识别）':'点击开始朗读（计时模式）'}</span></button>
    </div>
    <div id="zhRecStatus" style="font-size:12px;color:var(--sub);margin-top:8px;text-align:center;min-height:18px"></div>
    <div id="zhNext" style="margin-top:16px"></div>
  </div>`);
}
function zhClose(){zhStopRec(false);closeModal()}
function zhToggleRec(){
  const b=$('#recBtn'),rt=$('#recTxt');if(!b||!rt)return;
  if(zhCtx.rec||zhCtx.recTimer){zhStopRec(true);return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    try{
      const r=new SR();r.lang='zh-CN';r.interimResults=true;r.continuous=true;zhCtx.rec=r;zhCtx.recText='';
      r.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;zhCtx.recText=t;const st=$('#zhRecStatus');if(st)st.textContent='🎙️ 已识别 '+t.replace(/\s/g,'').length+' 字（读完点「完成朗读」）';};
      r.onerror=()=>{zhStopRec(true)};
      r.onend=()=>{if(zhCtx&&zhCtx.rec){zhCtx.rec=null;zhStopRec(true)}};
      r.start();
      b.classList.add('recording');rt.innerHTML='正在录音… <span class="wave">'+'<i style="animation-delay:0s"></i><i style="animation-delay:.15s"></i><i style="animation-delay:.3s"></i><i style="animation-delay:.45s"></i><i style="animation-delay:.6s"></i>'+'</span> · 点这里完成';
    }catch(e){zhStartTimerMode(b,rt)}
  }else{zhStartTimerMode(b,rt)}
}
function zhStartTimerMode(b,rt){
  zhCtx.recText='';
  b.classList.add('recording');rt.innerHTML='正在朗读…（本浏览器不支持语音识别）';
  let sec=0;zhCtx._tick=setInterval(()=>{sec++;const st=$('#zhRecStatus');if(st)st.textContent='⏱️ 已朗读 '+sec+' 秒'},1000);
  zhCtx.recTimer=setTimeout(()=>{zhStopRec(true)},20000);
}
function zhStopRec(ask){
  const b=$('#recBtn');if(!b)return;
  if(zhCtx._tick){clearInterval(zhCtx._tick);zhCtx._tick=null}
  if(zhCtx.recTimer){clearTimeout(zhCtx.recTimer);zhCtx.recTimer=null}
  if(zhCtx.rec){try{zhCtx.rec.stop()}catch(e){};zhCtx.rec=null}
  b.classList.remove('recording');b.innerHTML='<span style="font-size:24px">✅</span>朗读完成';
  if(ask)zhAfterRead();
}
async function zhAfterRead(){
  const nx=$('#zhNext');if(!nx||!zhCtx)return;
  const ct=zhCtx.ct;const recText=(zhCtx.recText||'').trim();
  const hasAI=!!(S.settings.aiKey||S.settings.apiKey);
  const useAI=hasAI&&S.settings.engine.chinese!=='program';
  nx.innerHTML=`<div class="ai-thinking">🤖 AI 老师正在根据你读的内容出题<div class="dots"><i></i><i></i><i></i></div></div>`;
  let q=null;
  if(useAI){
    try{
      const prompt=`你是小学语文老师。课文《${ct.title}》内容：${ct.passage}\n学生朗读识别结果（可能不全）：${recText||'（未识别到，按课文出题）'}\n请出一道与课文内容相关的四选一选择题。只返回JSON，格式：{"q":"题目","o":["选项A","选项B","选项C","选项D"],"a":0,"e":"一句话解析"}，a是正确选项下标0-3。题目要具体考查课文细节。`;
      const r=await aiChat([{role:'system',content:'你只输出纯JSON，不要任何其他文字。'},{role:'user',content:prompt}]);
      if(!document.querySelector('#zhNext')||!zhCtx)return;
      const m=r.match(/\{[\s\S]*\}/);
      if(m){const j=JSON.parse(m[0]);if(j.q&&Array.isArray(j.o)&&j.o.length===4&&typeof j.a==='number'){q=j}}
    }catch(e){}
  }
  if(!q)q=ct.qs[Math.floor(Math.random()*ct.qs.length)];
  zhCtx.q=q;
  zhCtx.useAI=useAI;
  nx.innerHTML=`
    <div style="font-size:12px;color:${recText?'var(--green)':'var(--sub)'};margin-bottom:8px">${recText?'🎙️ 朗读识别 '+recText.replace(/\s/g,'').length+' 字':'🎙️ 本次未启用语音识别'}</div>
    <div class="hw-box" style="margin-bottom:12px"><b>🤖 AI 老师：</b>${q.q}</div>
    <div class="opt-grid" style="margin-top:12px">${q.o.map((o,i)=>`<button class="opt-btn" onclick="zhAnswer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>
    <div id="zhFeed" style="margin-top:12px"></div>`;
}
async function zhAnswer(i){
  if(!zhCtx||!zhCtx.q)return;
  const q=zhCtx.q;
  const ok=i===q.a;
  const feed=$('#zhFeed');if(!feed)return;
  $$('.opt-btn').forEach((b,idx)=>{if(idx===q.a)b.classList.add('ok');b.disabled=true});
  if(!ok)$$('.opt-btn')[i]?.classList.add('bad');
  feed.innerHTML=`<div class="ai-thinking">🤖 AI 老师评分中<div class="dots"><i></i><i></i><i></i></div></div>`;
  let score,comment;
  const ct=zhCtx.ct;const recText=(zhCtx.recText||'').trim();
  if(zhCtx.useAI){
    try{
      const prompt=`课文《${ct.title}》：${ct.passage}\n题目：${q.q}\n正确选项：${String.fromCharCode(65+q.a)}. ${q.o[q.a]}\n学生选择：${String.fromCharCode(65+i)}. ${q.o[i]}\n学生朗读识别文本：${(recText||'无').substring(0,300)}\n请综合朗读表现和答题情况打分（0-100整数）。只返回JSON：{"score":数字,"comment":"40字内点评"}。评分标准：答对且朗读内容与课文匹配好 90+；答对但朗读匹配一般 75-89；答错但朗读了 50-74；答错且未识别到朗读 50 以下。`;
      const r=await aiChat([{role:'system',content:'你只输出纯JSON，不要任何其他文字。'},{role:'user',content:prompt}]);
      if(!document.querySelector('#zhFeed')||!zhCtx)return;
      const m=r.match(/\{[\s\S]*\}/);
      if(m){const j=JSON.parse(m[0]);if(typeof j.score==='number'){score=Math.max(0,Math.min(100,Math.round(j.score)));comment=j.comment||''}}
    }catch(e){}
  }
  if(typeof score!=='number'){
    const recLen=recText.replace(/\s/g,'').length;const need=Math.max(10,Math.round(ct.passage.length*0.4));
    const readScore=Math.min(40,Math.round(recLen/need*40));
    score=ok?Math.min(100,60+readScore):(recLen>need*0.5?55+Math.round(readScore/2):35);
    comment=ok?(recLen>=need?'朗读认真，回答正确！':'回答正确，朗读可以更完整一些'):'答案不对哦，再看看解析';
  }
  const reward=score>=90?{xp:25,c:15}:score>=75?{xp:20,c:10}:score>=60?{xp:15,c:7}:{xp:10,c:4};
  feed.innerHTML=`
  <div class="hw-box" style="background:${score>=75?'var(--green-l)':'var(--gold-l)'};border-color:${score>=75?'#a7f3d0':'#fde68a'}">
    <b>🤖 AI 老师评分：${score} 分${score>=90?' 🎉 优秀':score>=75?' 👍 良好':score>=60?' 💪 继续努力':' ↻ 明天再来'}</b><br>${comment?comment+'<br>':''}${ok?'✓ 答案正确':'✗ 正确答案：'+String.fromCharCode(65+q.a)+' · '+q.e}
  </div>
  <div class="reward-pop"><div class="rp"><span class="n">⭐+${reward.xp}</span><span class="l">经验</span></div><div class="rp"><span class="n">🪙+${reward.c}</span><span class="l">金币</span></div><div class="rp"><span class="n">${score}分</span><span class="l">按分数奖励</span></div></div>`;
  S.stats.readings++;gain(reward.xp,reward.c,0);
  setTimeout(()=>{completeTask('zh');closeModal();toast('📖 阅读完成！已累计 '+S.stats.readings+' 篇')},2400);
}

/* ---- 数学口算 ---- */
let calcState=null;
function calcTotal(){return S.settings.taskCount&&S.settings.taskCount.calc?Math.max(1,Math.min(50,S.settings.taskCount.calc)):3}
function runCalc(){
  const total=calcTotal();
  const today=new Date().toDateString();
  const pg=S.calcProgress;
  if(pg&&pg.date===today&&pg.i>0&&pg.i<pg.qs.length){
    openModal(`
    <div class="m-head"><h3>🔢 数学口算 · 继续？</h3><button class="m-x" onclick="closeModal()">✕</button></div>
    <div class="m-body" style="text-align:center;padding:24px 20px">
      <div style="font-size:40px;margin-bottom:10px">📝</div>
      <p style="font-size:14px;margin-bottom:4px">上次的口算做到第 <b style="color:var(--blue-d)">${pg.i+1}</b> / ${pg.qs.length} 题</p>
      <p style="font-size:12px;color:var(--sub);margin-bottom:16px">已答对 ${pg.right} 题 · 进度会自动保存，退出不丢失</p>
      <div style="display:flex;gap:10px;justify-content:center">
        <button class="btn primary" onclick="calcResume(true)">接着做 →</button>
        <button class="btn ghost" onclick="calcResume(false)">重新开始</button>
      </div>
    </div>`);
    return;
  }
  calcStart(total);
}
function calcResume(cont){
  closeModal();
  if(cont){calcState={i:S.calcProgress.i,right:S.calcProgress.right,qs:S.calcProgress.qs,wrong:S.calcProgress.wrong||[]}}
  else{S.calcProgress=null;save();calcStart(calcTotal())}
  calcRender();
}
function calcStart(total){
  calcState={i:0,right:0,qs:Array.from({length:total},genCalc),wrong:[]};
  calcSaveProgress();calcRender();
}
function calcSaveProgress(){
  const total=calcState.qs.length;
  if(calcState.i>=total){S.calcProgress=null}
  else{S.calcProgress={date:new Date().toDateString(),i:calcState.i,right:calcState.right,qs:calcState.qs,wrong:calcState.wrong}}
  save();
}
function calcRender(){
  const total=calcState.qs.length;
  const p=curProfile();
  openModal(`
  <div class="m-head"><h3>🔢 数学口算 · ${GRADES[p.grade].n}${p.term===2?'下册':'上册'}</h3><button class="m-x" onclick="closeModal()">✕</button></div>
  <div class="m-body">
    <div style="font-size:11px;color:var(--sub);margin-bottom:8px">共 ${total} 题 · 按正确率发奖励 · 进度自动保存</div>
    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:10px"><span>第 <b id="calcNo" style="color:var(--blue-d)">${calcState.i+1}</b> / ${total} 题</span><span>✓ <b id="calcOk" style="color:var(--green)">${calcState.right}</b> 题</span></div>
    <div class="calc-q" id="calcQ"></div>
    <input class="word-input" id="calcIpt" style="margin-top:14px" placeholder="输入答案…" inputmode="numeric">
    <div style="text-align:center;margin-top:14px"><button class="btn primary" onclick="calcSubmit()">提交 ✓</button></div>
    <div id="calcFeed" style="margin-top:12px"></div>
  </div>`);
  calcShowQ();
}
function calcShowQ(){
  $('#calcQ').textContent=calcState.qs[calcState.i].q+' = ?';
  $('#calcNo').textContent=calcState.i+1;
  const ipt=$('#calcIpt');ipt.value='';ipt.className='word-input';ipt.focus();
  ipt.onkeydown=e=>{if(e.key==='Enter')calcSubmit()};
}
function calcSubmit(){
  const total=calcState.qs.length;
  const q=calcState.qs[calcState.i],v=parseFloat($('#calcIpt').value);
  if(isNaN(v))return;
  const ipt=$('#calcIpt');
  if(v===q.ans){
    calcState.right++;ipt.className='word-input ok';S.stats.mathCorrect++;
    setTimeout(()=>{calcState.i++;calcSaveProgress();if(calcState.i>=total){calcFinish()}else calcShowQ()},350);
  }else{
    ipt.className='word-input bad';calcState.wrong.push(q);
    $('#calcFeed').innerHTML=`<div class="hw-box" style="background:var(--red-l);border-color:#fecaca;color:#b91c1c">✗ 正确答案：<b>${q.ans}</b> · 已加入错题本，明天变形重出</div>`;
    setTimeout(()=>{$('#calcFeed').innerHTML='';calcState.i++;calcSaveProgress();if(calcState.i>=total){calcFinish()}else calcShowQ()},1100);
  }
  $('#calcOk').textContent=calcState.right;
}
function calcFinish(){
  const total=calcState.qs.length;
  const r=calcState.right;
  const pct=Math.round(r/total*100);
  S.calcProgress=null;save();
  let xp,c,label;
  if(pct===100){xp=12;c=9;label='🥇 全对满分！'}
  else if(pct>=66){xp=8;c=6;label='👍 很棒！'}
  else if(pct>=33){xp=5;c=4;label='💪 继续加油'}
  else{xp=2;c=1;label='↻ 明天再来挑战'}
  $('#calcQ').innerHTML=`<span style="font-size:20px">完成！${r}/${total} 正确 · 正确率 ${pct}% ${label}</span>`;
  $('#calcIpt').style.display='none';
  $('#calcFeed').innerHTML=`<div class="reward-pop"><div class="rp"><span class="n">⭐+${xp}</span><span class="l">经验</span></div><div class="rp"><span class="n">🪙+${c}</span><span class="l">金币</span></div><div class="rp"><span class="n">${pct}%</span><span class="l">正确率</span></div></div>`;
  gain(xp,c,0);
  setTimeout(()=>{completeTask('calc');closeModal();toast('🔢 口算完成！正确率 '+pct+'%')},1800);
}

function bSkill(){
  B.skillMode=true;
  const harder=genCalc();
  const g=curProfile().grade;
  if(g>=4){harder.q=harder.q.replace(/\d+/g,m=>String(Math.floor(parseInt(m)*1.5+10)))}

  else{harder.q=`${10+Math.floor(Math.random()*20)} + ${10+Math.floor(Math.random()*20)} + ${5+Math.floor(Math.random()*10)}`;harder.ans=0;const nums=harder.q.match(/\d+/g).map(Number);harder.ans=nums.reduce((a,b)=>a+b,0)}
  B.q=harder;
  $('#bQ').innerHTML=`
    <div class="calc-q" style="font-size:22px;color:#d97706">🔥 技能题：${harder.q} = ?</div>
    <p style="font-size:11px;color:var(--gold);text-align:center;margin-top:4px">答对造成双倍伤害！答错受到双倍反击！</p>

function bSkillChoice(){
  B.skillMode=true;
  const _bp=curProfile();
  const bank=B.sub==='science'?scienceForGrade(_bp.grade):B.sub==='chinese'?chineseForGrade(_bp.grade,_bp.term||1).qs:SPORT_QS;
  const q=rnd(bank);B.q={sci:q,a:q.a};
  $('#bQ').innerHTML=`
    <div class="hw-box" style="font-weight:700;border-color:#f59e0b;background:#fffbeb">🔥 技能题：${q.q}</div>

    <div class="opt-grid" style="margin-top:10px">${q.o.map((o,i)=>`<button class="opt-btn" style="border-color:#fde68a" onclick="bAnswer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>`;
}
function bAnswer(sciIdx){
  let ok=false;
  if(B.q.sci!==undefined){ok=sciIdx===B.q.a}
  else{const v=$('#bIpt').value.trim().toLowerCase();ok=v!==''&&v===String(B.q.ans||B.q.word[0]);if($('#bIpt'))$('#bIpt').value=''}
  const dmg=B.skillMode?76:38;
  const counter=B.skillMode?40:20;
  if(ok){
    B.hp.m=Math.max(0,B.hp.m-dmg);
    $('#fP').firstChild&&$('#fP').classList.add('f-atk');setTimeout(()=>$('#fP').classList.remove('f-atk'),450);
    fx('#arena',B.skillMode?'🔥 -'+dmg+'!':'💥 -'+dmg,B.skillMode?'#f59e0b':'#ef4444','#fM');
    $('#bLog').innerHTML=B.skillMode?`🔥 技能命中！${B.pet.name}释放大招，BOSS 受到 ${dmg} 点伤害！`:`✓ 答对了！${B.pet.name}奋力一击，BOSS 受到 ${dmg} 点伤害！`;
  }else{
    B.hp.p=Math.max(0,B.hp.p-counter);
    $('#fM').classList.add('f-atk');setTimeout(()=>$('#fM').classList.remove('f-atk'),450);
    fx('#arena',B.skillMode?'🔥 -'+counter+'!':'🛡️ -'+counter,B.skillMode?'#f59e0b':'#94a3b8','#fP');
    $('#bLog').innerHTML=B.skillMode?`🔥 技能失败！BOSS 反击 ${counter} 点伤害！别灰心！`:`✗ 答错了，BOSS 反击！${B.pet.name}受到 ${counter} 点伤害。`;
  }
  $('#hpM').style.width=B.hp.m+'%';$('#hpMn').textContent=B.hp.m;
  $('#hpP').style.width=B.hp.p+'%';$('#hpPn').textContent=B.hp.p;
  $('#bQ').innerHTML='';
  if(B.hp.m<=0)return setTimeout(()=>bEnd(true),700);
  if(B.hp.p<=0)return setTimeout(()=>bEnd(false),700);
  setTimeout(bNextQ,1000);
}
function fx(sel,txt,color,targetSel){
  const el=$(sel),t=$(targetSel);
  if(!el||!t)return;
  const r=t.getBoundingClientRect(),er=el.getBoundingClientRect();
  const d=document.createElement('div');d.className='hit-fx';d.textContent=txt;d.style.color=color;
  d.style.left=(r.left-er.left+r.width/2-20)+'px';d.style.top=(r.top-er.top)+'px';
  el.appendChild(d);setTimeout(()=>d.remove(),700);
}
function bEnd(win){
  B.over=true;

}

async function aiChat(messages){

  if(!key)throw new Error('NO_API_KEY');
  const provider=S.settings.aiProvider||'deepseek';
  let url,model;
  if(provider==='openai'){url='https://api.openai.com/v1/chat/completions';model=S.settings.aiModel||'gpt-4o-mini'}
  else if(provider==='custom'){url=(S.settings.aiBaseUrl||'https://api.example.com/v1/chat/completions').replace(/\/$/,'');model=S.settings.aiModel||'custom'}
  else{url='https://api.deepseek.com/chat/completions';model='deepseek-chat'}

  if(!r.ok)throw new Error('API_ERROR '+r.status);
  const d=await r.json();
  return d.choices[0].message.content;
}

/* 上传前自动压缩：GIF 动图原样保留；其他图片等比缩到 maxSide 内并转 WebP（保留透明），
   浏览器不支持 WebP 编码时回退缩放后的 PNG；压缩后反而更大则用原图 */
function compressImage(f,maxSide=720){
  return new Promise(resolve=>{
    const rawExt=(f.name.split('.').pop()||'png').toLowerCase();
    if(f.type==='image/gif'){resolve({blob:f,ext:'gif'});return}
    const go=()=>{
      const img=new Image();
      const url=URL.createObjectURL(f);
      img.onload=()=>{
        try{
          const scale=Math.min(1,maxSide/Math.max(img.naturalWidth||1,img.naturalHeight||1));
          const w=Math.max(1,Math.round((img.naturalWidth||1)*scale)),h=Math.max(1,Math.round((img.naturalHeight||1)*scale));
          const cv=document.createElement('canvas');cv.width=w;cv.height=h;
          cv.getContext('2d').drawImage(img,0,0,w,h);
          cv.toBlob(b=>{
            URL.revokeObjectURL(url);
            if(!b){resolve({blob:f,ext:rawExt});return}
            if(b.size<f.size){
              const ext=b.type==='image/webp'?'webp':(b.type==='image/png'?'png':rawExt);
              resolve({blob:b,ext});
            }else resolve({blob:f,ext:rawExt});
          },'image/webp',0.9);
        }catch(e){URL.revokeObjectURL(url);resolve({blob:f,ext:rawExt})}
      };
      img.onerror=()=>{URL.revokeObjectURL(url);resolve({blob:f,ext:rawExt})};
      img.src=url;
    };
    if(f.size<200*1024){ // 小图直接传，避免重编码反而变大
      const probe=new Image();const u=URL.createObjectURL(f);
      probe.onload=()=>{URL.revokeObjectURL(u);if(Math.max(probe.naturalWidth,probe.naturalHeight)<=maxSide)resolve({blob:f,ext:rawExt});else go()};
      probe.onerror=()=>{URL.revokeObjectURL(u);resolve({blob:f,ext:rawExt})};
      probe.src=u;
    }else go();
  });
}

  toast('⏳ 正在压缩优化图片…');

const UPLOAD_TOKEN='cbxy-upload-8c1f';
function cloudRefs(){
  const refs=new Set();
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.indexOf('cbxy_data_')===0){
      try{const d=JSON.parse(localStorage.getItem(k)||'{}');
        if(d&&d.assets)Object.values(d.assets).forEach(u=>{if(typeof u==='string'&&u.indexOf('/uploads/')===0)refs.add(u.split('/').pop())});
      }catch(e){}
    }
  }
  return refs;
}
const fmtMB=n=>n>=1048576?(n/1048576).toFixed(2)+' MB':Math.max(1,Math.round(n/1024))+' KB';
async function scanCloudFiles(){
  if(!isAdmin()){toast('⛔ 云存储管理仅限管理员');return}
  const box=$('#cloudFiles'),sum=$('#cloudSummary');if(!box)return;
  sum.textContent='扫描中…';box.innerHTML='';
  try{
    const r=await fetch('/api/upload?u='+encodeURIComponent(currentUser)+'&token='+(currentToken||''),{headers:{'X-Upload-Token':UPLOAD_TOKEN}});
    const j=await r.json();
    if(!Array.isArray(j.files))throw new Error(j.error||('HTTP '+r.status));
    const refs=cloudRefs();
    const orphans=j.files.filter(f=>!refs.has(f.name));
    window._cloudOrphans=orphans;
    const orphanBytes=orphans.reduce((t,f)=>t+f.size,0);
    sum.textContent=`共 ${j.count} 个文件 · ${fmtMB(j.bytes)} · 使用中 ${j.count-orphans.length} · 未引用 ${orphans.length}（${fmtMB(orphanBytes)}）`;
    if(!orphans.length){
      box.innerHTML=`<div style="font-size:12.5px;color:#059669;background:var(--green-l);border:1px solid #a7f3d0;border-radius:8px;padding:9px 12px;margin-top:8px">✅ 没有发现无主文件，服务器空间干干净净</div>`;
      return;
    }
    box.innerHTML=`
    <div style="font-size:11px;color:var(--sub);margin:10px 0 6px">⚠️ 以下文件没有被本浏览器任何账号引用。若你在其他设备/浏览器上传过形象，删除前请先确认。</div>
    <div style="max-height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;margin-bottom:10px">
      ${orphans.map(f=>`<div style="display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:12px">
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</span>

      </div>`).join('')}
    </div>
    <button class="btn sm" style="background:#dc2626;color:#fff" onclick="cleanAllOrphans()">🗑 一键清理全部 ${orphans.length} 个未引用文件（${fmtMB(orphanBytes)}）</button>`;
  }catch(e){
    sum.textContent='扫描失败';
    box.innerHTML=`<div style="font-size:12.5px;color:#b91c1c;background:var(--red-l);border:1px solid #fecaca;border-radius:8px;padding:9px 12px;margin-top:8px">❌ 无法连接上传服务：${String(e.message)==='Failed to fetch'?'网络异常或服务未运行':e.message}</div>`;
  }
}

  toast('🪙 +'+n+' 金币（当前：'+S.kid.coins+'）');
}
function testAddFood(k,n){
  addItem(k,n);save();renderTop();
  toast(FOODS[k].ico+' +'+n+' '+FOODS[k].n+'（当前：'+(S.inventory[k]||0)+'）');
}
function testAddPetXp(n){
  if(S.pets.length===0){toast('还没有宠物，先去领养一只');return}
  S.pets.forEach(p=>{
    p.xp+=n;
    while(p.xp>=p.level*60){p.xp-=p.level*60;p.level++;petLevelUp(p)}
  });
  save();renderTop();
  toast('⭐ 所有宠物 +'+n+' 经验');
}
function testResetData(){
  openModal(`<div class="m-head"><h3>⚠️ 确认重置所有数据？</h3><button class="m-x" onclick="closeModal()">✕</button></div>
  <div class="m-body" style="text-align:center">
    <p style="font-size:14px;color:var(--sub);margin-bottom:16px">此操作不可撤销！所有孩子档案、宠物、任务进度将被清空。</p>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn" style="background:#dc2626;color:#fff" onclick="doResetData()">确认重置</button>
    </div>
  </div>`);
}
async function doResetData(){
  try{if(currentUser&&currentToken)await apiPost('/api/data/reset',{u:currentUser,token:currentToken})}catch(e){}
  localStorage.removeItem(KEY);location.reload();
}

/* ============ 端切换 ============ */
function enterKid(){
  $('#kidApp').classList.remove('hidden');$('#parentApp').classList.add('hidden');
}
function enterParent(){
  if(!S.profiles||S.profiles.length===0){showOnboarding();return}
  openModal(`<div class="m-head"><h3>🔒 家长验证</h3><button class="m-x" onclick="closeModal()">✕</button></div>
  <div class="m-body" style="text-align:center;padding:24px 20px">
    <div style="font-size:36px;margin-bottom:10px">🔐</div>
    <p style="font-size:13px;color:var(--sub);margin-bottom:16px">请输入家长密码进入家长后台<br><span style="font-size:11px">默认密码：0000（可在家长后台修改）</span></p>
    <div class="name-input-box"><input type="password" id="parentPwdInput" placeholder="家长密码" maxlength="20" onkeydown="if(event.key==='Enter')checkParentPwd()" style="text-align:center;font-size:18px;letter-spacing:4px"></div>
    <button class="btn primary" style="margin-top:14px;width:100%" onclick="checkParentPwd()">进 入 →</button>
  </div>`);
  setTimeout(()=>{const i=$('#parentPwdInput');if(i)i.focus()},200);
}
function checkParentPwd(){
  const v=($('#parentPwdInput')||{}).value||'';
  if(v===(S.settings.parentPwd||'0000')){
    closeModal();
    $('#parentApp').classList.remove('hidden');$('#kidApp').classList.add('hidden');
    renderPNav();switchPView(curPView);
  }else{
    toast('❌ 密码错误');
    const i=$('#parentPwdInput');if(i){i.value='';i.focus()}
  }
}
/* 兼容旧代码中通过 btnKid/btnParent 编程式调用 */
$('#btnKid').onclick=()=>enterKid();
$('#btnParent').onclick=()=>enterParent();

/* ============ 首次引导 ============ */
function showOnboarding(){
  openModal(`
  <div class="m-head"><h3>🐾 欢迎来到宠伴学园</h3><button class="m-x" onclick="closeModal()">✕</button></div>
  <div class="m-body" style="font-size:14px;line-height:1.8">
    <p style="color:var(--sub);margin-bottom:16px">孩子完成学习任务 → 赚取食物与经验 → 喂养宠物 → 宠物孵化、进化、战斗。<br>先创建第一个孩子档案，开始养成之旅吧！</p>
    <div class="add-species-box">
      <div class="add-species-field"><label>孩子姓名</label><input type="text" id="obName" placeholder="如：小明" maxlength="6" autofocus></div>
      <div class="add-species-field"><label>年级</label><select id="obGrade">${Object.entries(GRADES).map(([k,v])=>`<option value="${k}">${v.ico} ${v.n}</option>`).join('')}</select></div>
      <div class="add-species-field"><label>学期</label><select id="obTerm"><option value="1">上册</option><option value="2">下册</option></select></div>
    </div>
    <div style="text-align:center;margin-top:16px"><button class="btn primary" onclick="finishOnboarding()" style="padding:10px 32px;font-size:15px">开始使用 →</button></div>
  </div>`);
  setTimeout(()=>{const inp=$('#obName');if(inp)inp.focus()},200);
}
function finishOnboarding(){
  const name=($('#obName')||{}).value?.trim()||'';
  if(!name){toast('请输入孩子姓名');return}
  const grade=parseInt(($('#obGrade')||{}).value||'4');
  const term=parseInt(($('#obTerm')||{}).value||'1');
  const np=makeProfile(name,grade,term);
  S.profiles.push(np);
  S.currentProfileId=np.id;
  S.kid=np.kid;S.pets=np.pets;S.tasks=np.tasks;S.wrongWords=np.wrongWords;
  S.stats=np.stats;S.battleWins=np.battleWins;S.pending=np.pending;
  S.costumes=np.costumes;S.inventory=np.inventory;
  save();closeModal();
  renderTop();renderNav();switchKView('home');
  toast('🎉 档案创建成功！去任务页完成第一个任务吧');
}

/* ============ 初始化 ============ */
(async()=>{
  const _session=localStorage.getItem(SESSION_KEY);
  const _token=localStorage.getItem(TOKEN_KEY);
  if(_session&&_token){
    currentUser=_session;currentToken=_token;KEY='cbxy_data_'+_session;
    try{
      await pullAll(_session,_token);
      $('#loginScreen').classList.add('hidden');$('#kidApp').classList.remove('hidden');initApp();
    }catch(e){
      if(String(e.message)==='AUTH'){
        localStorage.removeItem(SESSION_KEY);localStorage.removeItem(TOKEN_KEY);
        currentUser=null;currentToken='';showLoginScreen();
      }else{
        loadUserData(_session);
        $('#loginScreen').classList.add('hidden');$('#kidApp').classList.remove('hidden');initApp();
        toast('⚠️ 云端暂不可达，已加载本地数据');
      }
    }
  }else if(_session){
    localStorage.removeItem(SESSION_KEY);
    showLoginScreen();
  }else{
    showLoginScreen();
  }
})();
</script>
