<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宠伴学园 · 界面雏形 V0.7</title>
<style>
/* ============ 基础 ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#3b82f6;--blue-d:#2563eb;--blue-l:#eff6ff;
  --gold:#f59e0b;--gold-l:#fffbeb;--purple:#8b5cf6;--purple-l:#f5f3ff;
  --green:#10b981;--green-l:#ecfdf5;--red:#ef4444;--red-l:#fef2f2;--orange:#f97316;--orange-l:#fff7ed;
  --ink:#1e293b;--sub:#64748b;--line:#e2e8f0;--card:#ffffff;
  --q-n:#94a3b8;--q-r:#3b82f6;--q-e:#a855f7;--q-b:#f59e0b;
  --shadow:0 6px 20px rgba(59,130,246,.08);
}
html,body{min-height:100%}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;color:var(--ink);background:#eef4fb;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit;outline:none}
.hidden{display:none!important}

/* ============ 演示控制条 ============ */
.demo-bar{position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:10px;padding:8px 16px;background:#0f172a;color:#cbd5e1;font-size:13px}
.demo-bar .dt{color:#7dd3fc;font-weight:700}
.demo-sw{padding:5px 16px;border-radius:999px;background:#1e293b;color:#94a3b8;font-size:13px;transition:.15s}
.demo-sw.on{background:#3b82f6;color:#fff}
.demo-sw:hover:not(.on){color:#e2e8f0}
.demo-bar .sp{flex:1}
.demo-note{color:#475569;font-size:12px}
.demo-help{padding:5px 12px;border-radius:8px;background:#1e293b;color:#38bdf8;font-size:12px}
.demo-reset{padding:5px 12px;border-radius:8px;background:#7f1d1d;color:#fca5a5;font-size:12px}
.demo-reset:hover{background:#991b1b}

/* ============ 通用组件 ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 22px;border-radius:12px;font-size:15px;font-weight:600;transition:.15s}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(59,130,246,.3)}
.btn.primary:hover{background:var(--blue-d);transform:translateY(-1px)}
.btn.gold{background:var(--gold);color:#fff;box-shadow:0 4px 12px rgba(245,158,11,.35)}
.btn.gold:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn.soft{background:var(--blue-l);color:var(--blue-d)}
.btn.soft:hover{background:#dbeafe}
.btn.ghost{background:#f1f5f9;color:var(--sub)}
.btn.ghost:hover{background:#e2e8f0}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:6px 14px;font-size:13px;border-radius:9px}
.btn.lg{padding:14px 32px;font-size:17px;border-radius:16px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:600}
.bar{height:8px;background:#eef2f7;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#60a5fa,#3b82f6);transition:width .4s}
.bar.g>i{background:linear-gradient(90deg,#34d399,#10b981)}
.bar.o>i{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
.bar.p>i{background:linear-gradient(90deg,#c084fc,#a855f7)}
.q-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;color:#fff}
.q-n{background:var(--q-n)}.q-r{background:var(--q-r)}.q-e{background:var(--q-e)}
.q-b{background:linear-gradient(135deg,#f59e0b,#fbbf24);box-shadow:0 0 8px rgba(245,158,11,.5)}

/* Toast / 弹窗 */
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-16px);z-index:500;background:rgba(15,23,42,.88);color:#fff;padding:11px 24px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;backdrop-filter:blur(6px);max-width:80vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-mask{position:fixed;inset:0;z-index:300;background:rgba(15,23,42,.4);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
.modal-mask.show{display:flex}
.modal{background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-radius:24px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 64px rgba(15,23,42,.3);animation:pop .22s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:18px 24px 0}
.m-head h3{font-size:18px;font-weight:800}
.m-x{width:32px;height:32px;border-radius:50%;background:#f1f5f9;color:#64748b;font-size:15px;display:flex;align-items:center;justify-content:center}
.m-x:hover{background:#e2e8f0}
.m-body{padding:16px 24px 24px}

/* ============ 孩子端 ============ */
#kidApp{max-width:1080px;margin:0 auto;padding:14px 20px 110px;min-height:100vh;background:linear-gradient(165deg,#f0f7ff 0%,#ffffff 55%,#e3f0fe 100%)}
.k-top{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 16px}
.k-logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;color:#1e3a8a}
.k-logo .lg-ico{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#60a5fa,#3b82f6);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(59,130,246,.35);font-size:20px}
.k-cur{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cur-chip{display:flex;align-items:center;gap:5px;background:#fff;border:1px solid #e3edf8;padding:7px 14px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:0 2px 8px rgba(59,130,246,.06)}
.cur-chip b{font-size:15px}
.cur-lbl{font-size:10px;color:var(--sub);font-weight:500}
.k-nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:6px;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);border:1px solid rgba(226,232,240,.9);border-radius:999px;padding:8px;box-shadow:0 12px 32px rgba(30,58,138,.16)}
.k-nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;width:78px;padding:8px 0;border-radius:999px;color:#64748b;font-size:12px;font-weight:600;transition:.15s;position:relative}
.k-nav-btn:hover{color:var(--blue)}
.k-nav-btn.on{background:linear-gradient(135deg,#60a5fa,#3b82f6);color:#fff;box-shadow:0 6px 14px rgba(59,130,246,.35)}
.k-nav-btn .nv-dot{position:absolute;top:4px;right:16px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.k-h1{font-size:24px;font-weight:800;margin:4px 0 4px;display:flex;align-items:center;gap:10px}
.k-sub{color:var(--sub);font-size:14px;margin-bottom:18px}
.kcard{background:#fff;border-radius:20px;padding:20px;box-shadow:var(--shadow);border:1px solid #eef4fb;transition:.18s}
.kcard:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(59,130,246,.12)}

/* 首页 */
.home-hero{display:flex;gap:18px;align-items:stretch;margin-bottom:18px}
.hero-main{flex:1;display:flex;gap:20px;align-items:center;background:linear-gradient(135deg,#3b82f6 0%,#2563eb 60%,#1d4ed8 100%);border-radius:24px;padding:24px 28px;color:#fff;position:relative;overflow:hidden;box-shadow:0 12px 32px rgba(37,99,235,.3)}
.hero-main::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 70% at 85% 20%,rgba(255,255,255,.18) 0%,transparent 60%);pointer-events:none}
.hero-main .hi-emoji{font-size:64px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.2));animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hero-txt h2{font-size:22px;font-weight:800;margin-bottom:6px}
.hero-txt p{font-size:13.5px;opacity:.9;line-height:1.7}
.hero-side{width:230px;display:flex;flex-direction:column;gap:12px}
.hst{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.hst .h-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px}
.hst .h-n{font-size:20px;font-weight:800;line-height:1}
.hst .h-l{font-size:11.5px;color:var(--sub);margin-top:3px}
.lvl-chip{font-size:11px;background:var(--blue-l);color:var(--blue-d);padding:2px 8px;border-radius:999px;font-weight:700}
.pb-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--sub)}
.pb-row .bar{flex:1}
.egg-tip{font-size:11px;color:var(--gold);font-weight:700}
.stage-tag{position:absolute;top:12px;right:12px;font-size:10.5px;color:#94a3b8;background:#f8fafc;padding:2px 8px;border-radius:999px;border:1px solid #eef2f7;z-index:2}

/* ============ 宠物动态与品质光效 ============ */
.pet-live{display:inline-block;animation:pkFloat 3.4s ease-in-out infinite;filter:drop-shadow(0 10px 14px rgba(30,58,138,.16))}
@keyframes pkFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
svg .pk-eyes{transform-box:fill-box;transform-origin:center;animation:pkBlink 4.6s infinite}
@keyframes pkBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
svg .pk-ear{transform-box:fill-box;transform-origin:50% 100%;animation:pkEar 3.2s ease-in-out infinite}
svg .pk-ear.d{animation-delay:.45s}
@keyframes pkEar{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-7deg)}}
svg .pk-tail{transform-box:fill-box;transform-origin:0% 60%;animation:pkWag 1.5s ease-in-out infinite}
@keyframes pkWag{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(10deg)}}
svg .pk-wing{transform-box:fill-box;transform-origin:80% 40%;animation:pkFlap .9s ease-in-out infinite}
svg .pk-wing.d{transform-origin:20% 40%;animation-delay:.25s}
@keyframes pkFlap{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-16deg)}}
svg .pk-sway{transform-box:fill-box;transform-origin:50% 95%;animation:pkSway 3.6s ease-in-out infinite}
@keyframes pkSway{0%,100%{transform:rotate(0deg)}50%{transform:rotate(6deg)}}
svg .pk-aura{transform-box:fill-box;transform-origin:center;animation:pkAura 2.6s ease-in-out infinite}
@keyframes pkAura{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
.egg-live{display:inline-block;animation:pkFloat 3.2s ease-in-out infinite;filter:drop-shadow(0 10px 12px rgba(30,58,138,.14))}
.egg-live svg{animation:pkEggTilt 4.8s ease-in-out infinite}
@keyframes pkEggTilt{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}

/* 宠物小屋 · 大卡片 */
.pet-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:18px}
.pet-card{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;position:relative;overflow:hidden;padding:24px 18px 18px;border-radius:24px;cursor:pointer}
.pet-card::before{content:'';position:absolute;left:0;right:0;bottom:0;height:72px;background:linear-gradient(180deg,transparent,rgba(147,197,253,.16));pointer-events:none}
.pet-card .pet-stage{height:158px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.pet-card .p-name{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.pet-card .pet-mood{font-size:12px;color:var(--sub);position:relative;z-index:1}
.pet-card .pet-bars{width:100%;display:flex;flex-direction:column;gap:6px;margin-top:2px;position:relative;z-index:1}
.pet-card:hover{transform:translateY(-5px) scale(1.015)}
.pet-card.qc-r{border:1px solid #bfdbfe;box-shadow:0 12px 32px rgba(59,130,246,.22)}
.pet-card.qc-e{border:1px solid #ddd6fe;box-shadow:0 12px 32px rgba(168,85,247,.24)}
.pet-card.qc-b{border:1px solid #fcd34d;box-shadow:0 0 26px rgba(245,158,11,.30),0 14px 34px rgba(245,158,11,.18)}
.pet-act{display:flex;gap:8px;margin-top:6px;position:relative;z-index:1}

/* 宠物页子标签 */
.sub-tabs{display:flex;gap:10px;margin:2px 0 20px;flex-wrap:wrap}
.sub-tab{display:flex;align-items:center;gap:7px;padding:10px 22px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:14.5px;font-weight:700;color:var(--sub);transition:.15s;box-shadow:0 2px 10px rgba(59,130,246,.05)}
.sub-tab:hover{border-color:#bfdbfe;color:var(--blue-d)}
.sub-tab.on{background:linear-gradient(135deg,#60a5fa,#3b82f6);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(59,130,246,.35)}
.sub-tab .st-badge{font-size:11px;background:rgba(255,255,255,.35);padding:1px 8px;border-radius:999px}
.sub-tab:not(.on) .st-badge{background:var(--blue-l);color:var(--blue-d)}
.pet-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}

/* 领养区升级 */
.adopt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.adopt-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 12px 18px;background:#fff;border-radius:20px;border:1px solid #eef4fb;transition:.18s;text-align:center;cursor:pointer;position:relative;overflow:hidden}
.adopt-card:not(.locked):hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(59,130,246,.16);border-color:#bfdbfe}
.adopt-card.locked{opacity:.55;cursor:not-allowed}
.adopt-card .ad-look{height:104px;display:flex;align-items:center;justify-content:center}
.adopt-card .ad-name{font-size:15px;font-weight:800}
.adopt-card .ad-full{font-size:11px;color:var(--sub)}
.adopt-card .ad-lock{font-size:11px;color:var(--sub)}
.adopt-card.qc-r{border-color:#bfdbfe}
.adopt-card.qc-e{border-color:#ddd6fe}

/* 神兽领养升级 */
.beast-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.beast-card{display:flex;gap:16px;align-items:center;padding:18px 20px;background:#fff;border-radius:20px;border:1px solid #eef4fb;position:relative;overflow:hidden;transition:.18s}
.beast-card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(245,158,11,.12)}
.beast-card .bs-ico{width:84px;height:84px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:18px;background:linear-gradient(160deg,#fffbeb,#fef3c7)}
.beast-card.bs-ready{background:linear-gradient(135deg,#fffbeb,#fff7ed);border:1px solid #f59e0b;box-shadow:0 0 24px rgba(245,158,11,.22)}
.beast-card.bs-owned{background:linear-gradient(135deg,#f0fdf4,#ecfdf5);border-color:#a7f3d0}
.beast-card .bs-info{flex:1;min-width:0}
.beast-card .bs-info h5{font-size:16px;font-weight:800;display:flex;gap:8px;align-items:center;margin-bottom:5px}
.beast-card .bs-info p{font-size:12px;color:var(--sub);margin-bottom:8px}
.beast-claim{position:absolute;right:14px;bottom:14px}

/* 任务页 */
.task-list{display:flex;flex-direction:column;gap:12px}
.task-card{display:flex;align-items:center;gap:16px;padding:16px 20px;background:#fff;border-radius:18px;border:1px solid #eef4fb;box-shadow:0 3px 10px rgba(59,130,246,.05);transition:.15s;cursor:pointer}
.task-card:hover{transform:translateX(4px);box-shadow:0 8px 22px rgba(59,130,246,.12)}
.task-card.done{opacity:.75;cursor:default}
.task-card.done:hover{transform:none}
.t-ico{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:21px;flex-shrink:0}
.t-mid{flex:1}
.t-mid h4{font-size:15.5px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.t-mid p{font-size:12.5px;color:var(--sub)}
.t-status{font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px;flex-shrink:0}
.ts-todo{background:var(--blue-l);color:var(--blue-d)}
.ts-done{background:var(--green-l);color:#059669}
.ts-wait{background:var(--gold-l);color:#b45309}
.ts-run{background:var(--purple-l);color:#7c3aed}
.task-progress-card{display:flex;align-items:center;gap:20px;margin-bottom:16px}
.ring-wrap{position:relative;width:92px;height:92px;flex-shrink:0}
.ring-wrap .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--sub)}
.ring-wrap .rt b{font-size:19px;color:var(--blue-d)}

/* 任务运行弹窗内 */
.run-word{font-size:15px}
.listen-btn{display:flex;align-items:center;gap:10px;background:var(--blue-l);color:var(--blue-d);border-radius:14px;padding:14px 20px;font-size:15px;font-weight:700;width:100%;justify-content:center;transition:.15s}
.listen-btn:hover{background:#dbeafe}
.word-input{width:100%;padding:14px 18px;border:2px solid var(--line);border-radius:14px;font-size:20px;text-align:center;letter-spacing:2px;transition:.15s}
.word-input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(59,130,246,.12)}
.word-input.ok{border-color:var(--green);background:var(--green-l)}
.word-input.bad{border-color:var(--red);background:var(--red-l);animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hw{height:64px;border:2px dashed #dbe7f6;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:13px;background:#f8fbff}
.hw-box{font-size:14.5px;line-height:2;color:#334155}
.rec-btn{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:16px;border-radius:16px;background:var(--red-l);color:var(--red);font-weight:700;transition:.15s}
.rec-btn:hover{background:#fee2e2}
.rec-btn.recording{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 12px rgba(239,68,68,0)}}
.wave{display:flex;gap:3px;align-items:center;height:24px}
.wave i{width:3px;background:currentColor;border-radius:2px;animation:wv 1s ease-in-out infinite}
@keyframes wv{0%,100%{height:5px}50%{height:22px}}
.ai-thinking{display:flex;align-items:center;gap:8px;color:#7c3aed;font-size:13.5px;font-weight:600;padding:12px;background:var(--purple-l);border-radius:12px}
.ai-thinking .dots i{width:5px;height:5px;border-radius:50%;background:#7c3aed;display:inline-block;margin:0 2px;animation:dt 1.2s infinite}
.ai-thinking .dots i:nth-child(2){animation-delay:.2s}.ai-thinking .dots i:nth-child(3){animation-delay:.4s}
@keyframes dt{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt-btn{padding:14px;border:2px solid var(--line);border-radius:14px;font-size:15px;font-weight:600;text-align:left;transition:.15s;background:#fff}
.opt-btn:hover{border-color:var(--blue);color:var(--blue-d)}
.opt-btn.ok{border-color:var(--green);background:var(--green-l);color:#059669}
.opt-btn.bad{border-color:var(--red);background:var(--red-l);color:#b91c1c}
.calc-q{font-size:26px;font-weight:800;text-align:center;padding:18px;letter-spacing:2px;background:#f8fbff;border-radius:14px;border:1px solid #e3edf8}
.reward-pop{display:flex;align-items:center;justify-content:center;gap:18px;padding:20px 0}
.reward-pop .rp{display:flex;flex-direction:column;align-items:center;gap:4px;animation:rw .5s ease}
@keyframes rw{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.reward-pop .rp .n{font-size:22px;font-weight:800}
.reward-pop .rp .l{font-size:11px;color:var(--sub)}

/* 宠物页 · 喂食选项（弹窗内） */
.feed-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.feed-opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border:2px solid var(--line);border-radius:14px;transition:.15s;background:#fff}
.feed-opt:hover:not(:disabled){border-color:var(--gold);background:var(--gold-l)}
.feed-opt:disabled{opacity:.4;cursor:not-allowed}
.feed-opt .f-ico{font-size:26px}
.feed-opt .f-n{font-size:12.5px;font-weight:700}
.feed-opt .f-e{font-size:10.5px;color:var(--sub)}

function decayStats(){
  const now=Date.now();
  const p=curProfile();if(!p)return;
  const last=p.kid.lastDecay||now;
  const hours=(now-last)/3600000;
  if(hours<0.05)return;
  p.kid.lastDecay=now;
  S.pets.forEach(pet=>{
    if(pet.egg)return;
    const loss=Math.round(hours*4);
    const before=pet.sat;
    pet.sat=Math.max(0,pet.sat-loss);
    const satNow=pet.sat;
    let moodLoss=0;
    if(satNow<=20){moodLoss=hours*2}
    else if(satNow<=50){moodLoss=hours*1}
    else if(satNow<=70){moodLoss=hours*0.5}
    if(moodLoss>0)pet.mood=Math.max(0,Math.round((pet.mood-moodLoss)*10)/10);
  });
  save();
}

let calcState=null;
function runCalc(){
  calcState={i:0,right:0,qs:Array.from({length:10},genCalc),wrong:[]};
  openModal(`
  <div class="m-head"><h3>🔢 数学口算挑战</h3><button class="m-x" onclick="closeModal()">✕</button></div>
  <div class="m-body">
    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:10px"><span>第 <b id="calcNo" style="color:var(--blue-d)">1</b> / 10 题</span><span>✓ <b id="calcOk" style="color:var(--green)">0</b> 题</span></div>
    <div class="calc-q" id="calcQ"></div>
    <input class="word-input" id="calcIpt" style="margin-top:14px" placeholder="输入答案…" inputmode="numeric">
    <div style="text-align:center;margin-top:14px"><button class="btn primary" onclick="calcSubmit()">提交 ✓</button></div>
    <div id="calcFeed" style="margin-top:12px"></div>
  </div>`);
  const ipt=$('#calcIpt');calcShowQ();ipt.addEventListener('keydown',e=>{if(e.key==='Enter')calcSubmit()});ipt.focus();
}
function calcShowQ(){
  $('#calcQ').textContent=calcState.qs[calcState.i].q+' = ?';
  $('#calcNo').textContent=calcState.i+1;
  const ipt=$('#calcIpt');ipt.value='';ipt.className='word-input';ipt.focus();
}
function calcSubmit(){
  const q=calcState.qs[calcState.i],v=parseFloat($('#calcIpt').value);
  if(isNaN(v))return;
  const ipt=$('#calcIpt');
  if(v===q.ans){
    calcState.right++;ipt.className='word-input ok';S.stats.mathCorrect++;
    setTimeout(()=>{calcState.i++;if(calcState.i>=10){calcFinish()}else calcShowQ()},350);
  }else{
    ipt.className='word-input bad';calcState.wrong.push(q);
    $('#calcFeed').innerHTML=`<div class="hw-box" style="background:var(--red-l);border-color:#fecaca;color:#b91c1c">✗ 正确答案：<b>${q.ans}</b> · 已加入错题本，明天变形重出</div>`;
    setTimeout(()=>{$('#calcFeed').innerHTML='';calcState.i++;if(calcState.i>=10){calcFinish()}else calcShowQ()},1100);
  }
  $('#calcOk').textContent=calcState.right;
}
function calcFinish(){
  const r=calcState.right;
  $('#calcQ').innerHTML=`<span style="font-size:20px">完成！${r}/10 正确 ${r===10?'🥇':'💪'}</span>`;
  $('#calcIpt').style.display='none';
  const xp=Math.round(r*1.5),c=Math.round(r*.8);
  $('#calcFeed').innerHTML=`<div class="reward-pop"><div class="rp"><span class="n">⭐+${xp}</span><span class="l">经验</span></div><div class="rp"><span class="n">🪙+${c}</span><span class="l">金币</span></div></div>`;
  gain(xp,c,0);S.stats.mathCorrect+=0;
  setTimeout(()=>{completeTask('calc');closeModal();toast('🔢 口算完成！')},1600);
}

function feedEgg(id,foodK){

  const stage=$('#eggStage');

    stage.innerHTML=`<span class="egg-crack" style="display:inline-block">${eggLook(140,p.fed,p.sp)}</span>`;

  }

  if(tipEl)tipEl.textContent='喂食进度 '+p.fed+'/3';
  if(p.fed>=3){
    setTimeout(()=>{

  }else{toast('🥚 蛋裂开了一点！再喂 '+(3-p.fed)+' 次就孵化啦')}

function feedPet(id,foodK){
  const p=S.pets.find(x=>x.id===id);const f=FOODS[foodK];
  if(!p||!f)return;
  if(!useItem(foodK,1)){toast('🍖 没有'+f.n+'了！去商城购买或做任务获取');return}
  p.sat=Math.min(100,p.sat+f.sat);p.mood=Math.min(100,p.mood+f.mood);p.xp+=f.exp;
  while(p.xp>=p.level*60){p.xp-=p.level*60;p.level++;petLevelUp(p)}
  save();renderTop();showPetDetail(id);
  const h=document.createElement('span');h.className='hearts';h.textContent='💗';h.style.left='60px';h.style.top='30px';if($('#petStage'))$('#petStage').appendChild(h);setTimeout(()=>h.remove(),1000);
  toast('😋 '+p.name+'吃得津津有味！（+'+f.sat+' 饱食 +' +f.exp+' 经验）');
}
function petLevelUp(p){
  const info=SPECIES_ALL()[p.sp]||BEASTS[p.sp];
  const maxSt=maxStageForQuality(info.q);
  let newS=0;
  for(let i=0;i<maxSt;i++){if(p.level>=EVO_LVLS[i])newS=i+1}
  const evolved=newS>p.stage;
  const oldStage=p.stage;
  p.stage=newS;
  setTimeout(()=>{
    if(evolved){
      confetti(80);
      toast('✨ '+p.name+'进化成「'+STAGES[newS]+'」了！形态大变！');
      showEvolutionEffect(p,oldStage,newS);
    }else toast('🎉 '+p.name+'升级到 Lv.'+p.level+'！');
  },300);
}

      <span style="font-size:28px">→</span>

    <button class="btn primary" onclick="closeModal();showPetDetail(${p.id})">太棒了！→</button>
  </div>`);

function petPat(id){
  const p=S.pets.find(x=>x.id===id);
  p.mood=Math.min(100,p.mood+5);save();showPetDetail(id);
  toast('🤗 '+p.name+'开心地蹭了蹭你～（心情 +5）');
}
function petPlay(id){
  const p=S.pets.find(x=>x.id===id);
  if(!p)return;
  if(p.sat<20){toast(p.name+'太饿了，没力气玩，先喂喂它吧！');return}
  p.sat=Math.max(0,p.sat-10);p.mood=Math.min(100,p.mood+15);p.xp+=20;
  while(p.xp>=p.level*60){p.xp-=p.level*60;p.level++;petLevelUp(p)}
  save();showPetDetail(id);confetti(15);
  toast('🎾 '+p.name+'玩得超开心！（心情+15 经验+20 饱食-10）');
}

function bNextQ(){
  if(B.over)return;
  B.round++;
  B.skillMode=false;
  if(B.sub==='math'){
    B.q=genCalc();$('#bQ').innerHTML=`
      <div class="calc-q" style="font-size:22px">${B.q.q} = ?</div>

  }else if(B.sub==='science'||B.sub==='chinese'||B.sub==='sport'){
    const bank=B.sub==='science'?scienceForGrade(curProfile().grade):B.sub==='chinese'?chineseForGrade(curProfile().grade).qs:SPORT_QS;
    const q=rnd(bank);B.q={sci:q,a:q.a};

      <div class="hw-box" style="font-weight:700">${q.q}</div>
      <div class="opt-grid" style="margin-top:12px">${q.o.map((o,i)=>`<button class="opt-btn" onclick="bAnswer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>
      <div style="text-align:center;margin-top:10px"><button class="btn" style="background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;font-size:12px" onclick="bSkillChoice()">技能攻击 🔥（答对双倍伤害）</button></div>`;
  }else{
    const w=rnd(wordsForGrade(curProfile().grade));B.q={word:w};
    $('#bQ').innerHTML=`
      <button class="listen-btn" onclick="speak('${w[0]}')">🔊 听发音猜单词（${w[1]}）</button>
      <input class="word-input" id="bIpt" style="margin-top:10px" placeholder="输入英文单词…">
      <div style="text-align:center;margin-top:12px;display:flex;gap:10px;justify-content:center">
        <button class="btn primary" onclick="bAnswer()">普通攻击 ⚔️</button>
        <button class="btn" style="background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff" onclick="bSkill()">技能攻击 🔥</button>
      </div>`;
    const ipt=$('#bIpt');ipt.focus();ipt.addEventListener('keydown',e=>{if(e.key==='Enter')bAnswer()});
  }
}
function bSkill(){
  B.skillMode=true;
  const harder=genCalc();
  const g=curProfile().grade;
  if(g>=4){harder.q=harder.q.replace(/\d+/g,m=>String(Math.floor(parseInt(m)*1.5+10)))}
  else if(g>=2){const a=50+Math.floor(Math.random()*50),b=20+Math.floor(Math.random()*30);harder.q=`${a} × ${b}`;harder.ans=a*b}
  else{harder.q=`${10+Math.floor(Math.random()*20)} + ${10+Math.floor(Math.random()*20)} + ${5+Math.floor(Math.random()*10)}`;harder.ans=0;const nums=harder.q.match(/\d+/g).map(Number);harder.ans=nums.reduce((a,b)=>a+b,0)}
  B.q=harder;
  $('#bQ').innerHTML=`
    <div class="calc-q" style="font-size:22px;color:#d97706">🔥 技能题：${harder.q} = ?</div>
    <p style="font-size:11px;color:var(--gold);text-align:center;margin-top:4px">答对造成双倍伤害！答错受到双倍反击！</p>
    <input class="word-input" id="bIpt" style="margin-top:8px;border-color:#f59e0b" placeholder="答案…" inputmode="numeric">
    <div style="text-align:center;margin-top:10px"><button class="btn" style="background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff" onclick="bAnswer()">释放技能！🔥</button></div>`;
  const ipt=$('#bIpt');ipt.focus();ipt.addEventListener('keydown',e=>{if(e.key==='Enter')bAnswer()});
}
function bSkillChoice(){
  B.skillMode=true;
  const g=curProfile().grade;
  const bank=B.sub==='science'?scienceForGrade(g):B.sub==='chinese'?chineseForGrade(g).qs:SPORT_QS;
  const q=rnd(bank);B.q={sci:q,a:q.a};
  $('#bQ').innerHTML=`
    <div class="hw-box" style="font-weight:700;border-color:#f59e0b;background:#fffbeb">🔥 技能题：${q.q}</div>
    <p style="font-size:11px;color:var(--gold);text-align:center;margin-top:4px">答对双倍伤害！答错双倍反击！</p>
    <div class="opt-grid" style="margin-top:10px">${q.o.map((o,i)=>`<button class="opt-btn" style="border-color:#fde68a" onclick="bAnswer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>`;
}
function bAnswer(sciIdx){
  let ok=false;
  if(B.q.sci!==undefined){ok=sciIdx===B.q.a}
  else{const v=$('#bIpt').value.trim().toLowerCase();ok=v!==''&&v===String(B.q.ans||B.q.word[0]);if($('#bIpt'))$('#bIpt').value=''}
  const dmg=B.skillMode?76:38;
  const counter=B.skillMode?40:20;
  if(ok){
    B.hp.m=Math.max(0,B.hp.m-dmg);
    $('#fP').firstChild&&$('#fP').classList.add('f-atk');setTimeout(()=>$('#fP').classList.remove('f-atk'),450);
    fx('#arena',B.skillMode?'🔥 -'+dmg+'!':'💥 -'+dmg,B.skillMode?'#f59e0b':'#ef4444','#fM');
    $('#bLog').innerHTML=B.skillMode?`🔥 技能命中！${B.pet.name}释放大招，BOSS 受到 ${dmg} 点伤害！`:`✓ 答对了！${B.pet.name}奋力一击，BOSS 受到 ${dmg} 点伤害！`;
  }else{
    B.hp.p=Math.max(0,B.hp.p-counter);
    $('#fM').classList.add('f-atk');setTimeout(()=>$('#fM').classList.remove('f-atk'),450);
    fx('#arena',B.skillMode?'🔥 -'+counter+'!':'🛡️ -'+counter,B.skillMode?'#f59e0b':'#94a3b8','#fP');
    $('#bLog').innerHTML=B.skillMode?`🔥 技能失败！BOSS 反击 ${counter} 点伤害！别灰心！`:`✗ 答错了，BOSS 反击！${B.pet.name}受到 ${counter} 点伤害。`;
  }
  $('#hpM').style.width=B.hp.m+'%';$('#hpMn').textContent=B.hp.m;
  $('#hpP').style.width=B.hp.p+'%';$('#hpPn').textContent=B.hp.p;
  $('#bQ').innerHTML='';
  if(B.hp.m<=0)return setTimeout(()=>bEnd(true),700);
  if(B.hp.p<=0)return setTimeout(()=>bEnd(false),700);
  setTimeout(bNextQ,1000);
}
function fx(sel,txt,color,targetSel){
  const el=$(sel),t=$(targetSel);
  if(!el||!t)return;
  const r=t.getBoundingClientRect(),er=el.getBoundingClientRect();
  const d=document.createElement('div');d.className='hit-fx';d.textContent=txt;d.style.color=color;
  d.style.left=(r.left-er.left+r.width/2-20)+'px';d.style.top=(r.top-er.top)+'px';
  el.appendChild(d);setTimeout(()=>d.remove(),700);
}
function bEnd(win){
  B.over=true;
  if(win){
    S.battleWins[B.sub]=(S.battleWins[B.sub]||0)+1;
    const c=20+Math.floor(Math.random()*30);
    addItem('rare',1);gain(30,c,0);

    $('#bEnd').innerHTML=`<div class="reward-pop"><div class="rp"><span class="n">⭐+30</span><span class="l">经验</span></div><div class="rp"><span class="n">🪙+${c}</span><span class="l">金币</span></div><div class="rp"><span class="n">🍖+1</span><span class="l">稀有食物</span></div></div>

}

async function deepSeekChat(messages){
  const key=S.settings.apiKey;
  if(!key)throw new Error('NO_API_KEY');
  const r=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'deepseek-chat',messages,temperature:0.7,max_tokens:500})});

  return d.choices[0].message.content;

    <div class="row-set"><div class="rs-l"><b>饱食度警告阈值</b><span>低于此值时宠物卡片显示饥饿图标</span></div><div style="display:flex;align-items:center;gap:6px"><input class="num-ipt" value="${S.settings.satWarn}" min="0" max="100" onchange="S.settings.satWarn=+this.value||30;save();renderPPets()"></div></div>
    <div class="row-set"><div class="rs-l"><b>饱食度衰减</b><span>每天 -20</span></div><input class="num-ipt" value="20" onchange="toast('演示版：已标记修改')"></div>
    <div class="row-set"><div class="rs-l"><b>生病机制</b><span>连续 ${S.settings.sickDays||3} 天饱食度为 0 生病</span></div><div class="sw on" onclick="this.classList.toggle('on');toast('演示版：开关已标记')"></div></div>
  </div>
  <div class="panel">
    <h3>📦 新增宠物品种 <span class="h-note">孩子玩久了可以添加新品种保持新鲜感</span></h3>
    <p style="font-size:12px;color:var(--sub);margin-bottom:8px">新品种默认使用通用形象，可在「🎨 形象替换」面板为每个进化阶段上传自定义图片。新品种会自动出现在孩子端「宠物领养」页面。</p>
    <div class="add-species-box">
      <div class="add-species-field"><label>品种名称</label><input type="text" id="newSpN" placeholder="如：小熊猫" maxlength="6"></div>
      <div class="add-species-field"><label>完全体名称</label><input type="text" id="newSpFull" placeholder="如：功夫熊猫" maxlength="8"></div>
      <div class="add-species-field"><label>品质</label><select id="newSpQ"><option value="n">普通</option><option value="r">稀有</option><option value="e">珍贵</option><option value="b">神兽</option></select></div>
      <div class="add-species-field"><label>技能名</label><input type="text" id="newSpSkill" placeholder="如：摔跤" maxlength="6"></div>
    </div>
    <div style="text-align:center;margin-top:10px"><button class="btn primary" onclick="addCustomSpecies()">＋ 添加新品种</button></div>
    ${S.customSpecies.length?`<table class="ptab" style="margin-top:10px"><tr><th>品种</th><th>品质</th><th>完全体</th><th>操作</th></tr>${S.customSpecies.map(c=>`<tr><td><b>${c.n}</b></td><td>${QN[c.q][0]}</td><td>${c.full}</td><td><button class="btn sm ghost" onclick="removeCustomSpecies('${c.id}')">删除</button></td></tr>`).join('')}</table>`:''}
  </div>`;
}
function addCustomSpecies(){
  const n=($('#newSpN')||{}).value?.trim()||'';
  const full=($('#newSpFull')||{}).value?.trim()||'';
  const q=($('#newSpQ')||{}).value||'n';
  const skill=($('#newSpSkill')||{}).value?.trim()||'技能';
  if(!n){toast('请输入品种名称');return}
  if(!full){toast('请输入完全体名称');return}
  const id='custom_'+Date.now();
  S.customSpecies.push({id,n,full,q,skill,tip:'自定义品种'});
  save();renderPPets();
  toast('✅ 新品种「'+n+'」已添加！孩子端领养页面可看到');
}
function removeCustomSpecies(id){
  const c=S.customSpecies.find(x=>x.id===id);if(!c)return;
  S.customSpecies=S.customSpecies.filter(x=>x.id!==id);
  save();renderPPets();
  toast('已删除品种「'+c.n+'」');
}
function renderPAssets(){
  const usedK=Math.max(0,Math.round(Object.values(S.assets).reduce((t,s)=>t+(s||'').length,0)/1024));
  const kb=s=>Math.max(1,Math.round((s||'').length/1024));
  const stageRow=(sp,stageIdx)=>{
    const ak=sp+'_s'+stageIdx;
    const has=!!S.assets[ak];
    const preview=stageIdx===0?eggLook(36,0,sp):petLook(sp,36,{stage:stageIdx,beast:BEASTS[sp]});
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;width:70px">
      <div style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:#f8fafc;border:1px solid var(--line);border-radius:10px;position:relative">
        ${preview}${has?'<span style="position:absolute;top:-2px;right:-2px;font-size:10px;background:var(--green);color:#fff;border-radius:50%;width:14px;height:14px;display:flex;align-items:center;justify-content:center">✓</span>':''}
      </div>
      <span style="font-size:9px;color:var(--sub)">${stageIdx===0?'蛋':STAGES[stageIdx]}</span>
      <label class="btn sm soft" style="cursor:pointer;padding:2px 8px;font-size:10px">${has?'换':'传'}<input type="file" accept="image/gif,image/png,image/svg+xml,image/webp,image/jpeg" style="display:none" onchange="uploadAsset('${ak}',this)"></label>
      ${has?`<button class="btn sm ghost" style="padding:1px 6px;font-size:9px;color:#dc2626" onclick="clearAsset('${ak}')">删</button>`:''}
    </div>`;
  };
  const speciesCard=([sp,i])=>{
    const isBeast=!!BEASTS[sp];
    const q=i.q||'n';
    const maxSt=maxStageForQuality(q);
    const stages=Array.from({length:maxSt+1},(_,idx)=>idx);
    const name=(S.customNames&&S.customNames[sp])||i.n;
    const stageCountText=maxSt===5?'6 阶段（含超神体）':maxSt===4?'5 阶段（含究极体）':'4 阶段';
    return `<div class="kcard" style="padding:12px;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <b style="font-size:13px">${isBeast?'✨':''}${name}</b>
        <span class="q-badge ${QN[q]?QN[q][1]:'q-n'}" style="font-size:10px;padding:1px 6px">${QN[q]?QN[q][0]:'普通'}</span>
        ${!isBeast?`<input type="text" value="${name}" maxlength="6" style="font-size:11px;padding:2px 6px;border:1px solid var(--line);border-radius:6px;width:80px" onchange="renameSpecies('${sp}',this.value)" placeholder="改名">`:''}
        <span style="font-size:10px;color:var(--sub)">${stageCountText}</span>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${stages.map(s=>stageRow(sp,s)).join('')}</div>
    </div>`;
  };
  $('#pViews').innerHTML=`
  <div class="p-h1">🎨 形象替换 · 物种管理</div>
  <div class="p-sub">每个物种可按进化阶段分别上传自定义图片 · 可修改物种名称 · 上传后孩子端即时生效</div>
  <div class="panel" style="background:var(--blue-l);border-color:#bfdbfe">
    <h3 style="color:var(--blue-d)">💡 使用说明</h3>
    <div style="font-size:12.5px;color:#1e40af;line-height:1.9">单张 ≤ 400 KB · 透明背景效果最佳 · 每个物种的每个阶段独立上传（普通：蛋~完全体 / 稀有+珍贵：蛋~究极体 / 神兽：蛋~超神体）· 蛋图片按物种独立互不干扰 · 物种名称可直接修改</div>
    <div class="row-set"><div class="rs-l"><b>自定义素材占用</b><span>${usedK} KB / 约 5000 KB</span></div><div class="bar" style="width:160px"><i style="width:${Math.min(100,usedK/50)}%"></i></div></div>
  </div>
  <div class="panel"><h3>🐾 普通宠物</h3>${Object.entries(SPECIES_ALL()).filter(([,i])=>i.q==='n').map(speciesCard).join('')}</div>
  <div class="panel"><h3>🌟 稀有 · 珍贵</h3>${Object.entries(SPECIES_ALL()).filter(([,i])=>i.q==='r'||i.q==='e').map(speciesCard).join('')}</div>
  <div class="panel"><h3>✨ 神兽</h3>${Object.entries(BEASTS).map(speciesCard).join('')}</div>`;
}
function renameSpecies(sp,v){
  const name=v.trim();if(!name)return;
  if(!S.customNames)S.customNames={};
  S.customNames[sp]=name;save();
  toast('✅ 已改名为「'+name+'」');
}
function uploadAsset(sp,el){
  const f=el.files&&el.files[0];
  if(!f)return;
  if(!/^image\/(gif|png|svg\+xml|webp|jpeg|jpg)$/i.test(f.type)){toast('仅支持 PNG / GIF / SVG / WebP / JPG 图片');el.value='';return}
  if(f.size>400*1024){toast('图片 '+Math.round(f.size/1024)+' KB，超过 400 KB 限制，请压缩后再传');el.value='';return}
  const r=new FileReader();
  r.onload=()=>{
    try{
      S.assets[sp]=r.result;save();
      renderPAssets();switchKView(curView);
      toast('✅ 形象已更新！切到孩子端即可看到新形象');
    }catch(e){
      delete S.assets[sp];
      toast('❌ 保存失败：本地存储空间不足，请换小一点的图片');
    }
  };
  r.onerror=()=>toast('❌ 图片读取失败，请重试');
  r.readAsDataURL(f);
}
function clearAsset(sp){
  delete S.assets[sp];save();renderPAssets();switchKView(curView);
  toast('已恢复默认手绘形象');
}
function setBeastGoal(k,v){
  const n=parseInt(v,10);
  if(!n||n<1){toast('请输入有效的目标值');return}
  S.beastGoals[k]=n;save();
  const b=BEASTS[k];
  toast('✅ '+b.n+'目标已调整为 '+n+b.unit+'（孩子端即时生效）');
  renderPPets();
}

    <div class="row-set"><div class="rs-l"><b>单次使用时长</b><span>超时强制休息（护眼页面 + 宠物陪做眼保健操）</span></div><button class="btn sm ghost">30 分钟</button></div>
    <div class="row-set"><div class="rs-l"><b>每日娱乐总时长</b><span>战斗 + 商城合计，学习不限</span></div><button class="btn sm ghost">40 分钟</button></div>

  <div class="panel">
    <h3>设备锁定指引（iPad）</h3>

      ② 打开孩子端网页 → 连按 3 次电源键 → 开始（Home/通知/切换全部失效）<br>

    </div>

  <div class="panel">

    <div class="row-set"><div class="rs-l"><b>外网访问家长端</b><span>https://pet.example.com · 华为手机浏览器打开即用</span></div><span class="pill-note">出差可用</span></div>
  </div>`;
}
function renderPConfirm(){
  renderPNav();
  $('#pViews').innerHTML=`
  <div class="p-h1">✅ 待确认事项</div>
  <div class="p-sub">体育和生活类任务需要你验收 · 手机上 10 秒搞定</div>
  ${S.pending.sport?`
  <div class="confirm-card">
    <span style="font-size:30px">🏃</span>
    <div class="cc-mid"><b>跳绳 200 个</b><p>${S.kid.name} 刚刚提交 · ${new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})} · 完整版可附跳绳视频</p></div>
    <button class="btn sm danger" onclick="confirmSport(false)">驳回</button>

  </div>
  <p style="font-size:12px;color:var(--sub)">确认后：经验 +15 · 金币 +8 · 50% 概率掉落食物 · 同步到孩子端</p>`:
  `<div class="panel" style="text-align:center;color:var(--sub);font-size:13.5px">🎉 暂无待确认事项</div>`}
  <div class="panel">

  </div>`;
}
function confirmSport(ok){
  S.pending.sport=false;
  const t=S.tasks.find(x=>x.id==='sport');
  if(ok){t.status='done';gain(15,8,Math.random()<.5?1:0);toast('✅ 已确认跳绳任务，奖励已发到孩子端')}
  else{t.status='todo';toast('已驳回，孩子可重新提交')}
  save();renderPNav();renderPConfirm();
}
