## 宠伴学园 · Nginx 站点配置（原默认配置已备份为 default.bak-*）
server {
	listen 80 default_server;
	listen [::]:80 default_server;

	root /var/www/html;
	index index.html;
	server_name _;

	# 图片上传接口 -> 本地上传服务（单文件上限 12MB）
	location /api/ {
		proxy_pass http://127.0.0.1:9001;
		proxy_set_header Host $host;
		proxy_read_timeout 120s;
		client_max_body_size 12m;
	}

	# 已上传的图片（长期缓存）
	location /uploads/ {
		alias /var/www/petapp/uploads/;
		expires 30d;
		add_header Cache-Control "public";
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
